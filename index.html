<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Beatboxtools">
<title>Beatboxtools</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="stylesheet" href="fonts.css?v=20261108g">
<style>
  :root{
    color-scheme:dark;
    --bg:#14161a; --panel:#1c1f24; --panel-2:#242830; --line:#2e333b;
    --text:#e9e6df; --text-dim:#8b9098; --text-faint:#82878f;
    --accent:#f2b134; --accent-dim:#7a6224; --on-accent:#1c1500; --accent-2:#c1443c;
    --safe-top:calc(env(safe-area-inset-top,0px)*0.65); --safe-bottom:env(safe-area-inset-bottom,0px);
    --f-head:'Oswald','Arial Narrow',system-ui,sans-serif;
    --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  body{display:flex;flex-direction:column;height:100vh;height:100dvh;font-family:var(--f-body);color:var(--text);-webkit-font-smoothing:antialiased}

  /* top bar */
  .topbar{flex:none;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(6px + var(--safe-top)) 18px 4px}
  .topbar-in{max-width:480px;margin:0 auto;min-height:42px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{min-width:0}
  .brand h1{margin:0;font:700 20px/1.1 var(--f-head);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
  .brand h1 span{color:var(--accent)}
  .brand-tag{display:block;margin-top:1px;font-size:11px;color:var(--text-faint);text-transform:lowercase;letter-spacing:.04em}
  .top-btn{
    position:relative;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;padding:0;cursor:pointer;flex:none;
    background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);text-decoration:none;
    transition:color .15s,border-color .15s;
  }
  .top-btn:hover{color:var(--text)}
  .top-btn svg{width:17px;height:17px;fill:currentColor}
  .top-btn[aria-expanded="true"]{color:var(--accent);border-color:var(--accent)}
  .top-btn.live::after{
    content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 2px var(--bg);animation:blink 1.1s ease-in-out infinite;
  }
  .top-btn:focus-visible,nav button:focus-visible,.tool:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* pages */
  .stage{position:relative;flex:1;min-height:0}
  .view{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);visibility:hidden;pointer-events:none}
  .view.on{visibility:visible;pointer-events:auto}

  /* tab bar */
  nav{flex:none;position:relative;background:var(--bg);border-top:1px solid var(--line);padding:0 0 var(--safe-bottom)}
  .tabs{position:relative;display:flex;max-width:480px;margin:0 auto;padding:4px 8px}
  .tab-indicator{
    position:absolute;top:-1px;left:8px;width:calc((100% - 16px)/4);height:2.5px;background:var(--accent);border-radius:2px;
    transition:transform .25s cubic-bezier(.65,0,.35,1);
  }
  nav button{
    position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 2px 4px;background:none;border:0;border-radius:8px;cursor:pointer;
    color:var(--text-faint);font:600 11px var(--f-head);letter-spacing:.05em;text-transform:uppercase;
    touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:color .15s,background .15s;
  }
  nav button:active{background:var(--panel-2)}
  nav button svg{width:19px;height:19px;fill:currentColor;flex:none}
  nav button[aria-selected="true"]{color:var(--accent)}
  nav button.recording::after{
    content:"";position:absolute;top:5px;left:calc(50% + 7px);width:8px;height:8px;border-radius:50%;
    background:var(--accent-2);box-shadow:0 0 0 2px var(--bg);animation:blink 1.1s ease-in-out infinite;
  }
  @keyframes blink{50%{opacity:.35}}

  /* tools: full-screen layer with X and a title bar */
  .ov{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;visibility:hidden;opacity:0;transform:translateY(22px);transition:opacity .2s ease,transform .24s cubic-bezier(.2,.8,.2,1),visibility 0s .24s}
  .ov.open{visibility:visible;opacity:1;transform:none;transition:opacity .2s ease,transform .24s cubic-bezier(.2,.8,.2,1)}
  .ov-bar{flex:none;display:flex;align-items:center;padding:calc(6px + var(--safe-top)) 14px 6px;border-bottom:1px solid var(--line);min-height:50px}
  .ov-bar h2{flex:1;margin:0;text-align:center;font:700 18px var(--f-head);letter-spacing:.1em;text-transform:uppercase}
  .ov-bar h2 span{color:var(--accent)}
  .ov-body{flex:1;min-height:0;position:relative}
  .pane{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);visibility:hidden;overflow:auto}
  .pane.on{visibility:visible}
  .ov:not(.open){pointer-events:none}
  .ov:not(.open) .pane{visibility:hidden}
  .ov-bar .top-btn.gone{visibility:hidden}
  .tools .hint{margin:18px 4px 0;color:var(--text-faint);font-size:12px;line-height:1.5;text-align:center}
  .tools{padding:16px;max-width:480px;margin:0 auto}
  .tools .sl{display:block;margin:6px 0 10px;font:500 12px var(--f-head);letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint)}
  .tools .sl.gap{margin-top:20px}
  .tool{
    display:flex;align-items:center;gap:14px;width:100%;text-align:left;text-decoration:none;color:inherit;font:inherit;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;
    transition:border-color .15s,background .15s;
  }
  .tool:active{background:var(--panel-2);border-color:var(--accent-dim)}
  .tool .ti{flex:none;width:44px;height:44px;border-radius:10px;background:rgba(242,177,52,.12);border:1px solid var(--accent-dim);color:var(--accent);display:grid;place-items:center}
  .tool .ti svg{width:22px;height:22px;fill:currentColor}
  .tool b{display:block;font:600 15px var(--f-head);letter-spacing:.08em;text-transform:uppercase}
  .tool small{display:block;margin-top:2px;color:var(--text-dim);font-size:12px;line-height:1.4}
  .tool .go{margin-left:auto;color:var(--text-faint);font-size:20px;line-height:1}
  .tool .run{display:none;margin-left:auto;font:600 10px var(--f-head);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent-dim);border-radius:6px;padding:2px 6px}
  .tool.live .run{display:block}
  .tool.live .go{display:none}

  @media (prefers-reduced-motion:reduce){.tab-indicator,.ov{transition:none}nav button.recording::after,.top-btn.live::after{animation:none}}
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <h1>Beatbox <span>Tools</span></h1>
        <span class="brand-tag">by savior</span>
      </div>
      <button class="top-btn" id="toolsBtn" type="button" aria-label="Tools" aria-haspopup="dialog" aria-expanded="false" aria-controls="ov">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6.5v6.5H4zM13.5 4H20v6.5h-6.5zM4 13.5h6.5V20H4zM13.5 13.5H20V20h-6.5z"/></svg>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <iframe id="v-voice" class="view" src="voice.html?v=20261108g" title="Voice note recorder" role="tabpanel" allow="autoplay; screen-wake-lock; microphone"></iframe>
    <iframe id="v-history" class="view" src="history.html?v=20261108g" title="Voice note history" role="tabpanel" allow="autoplay"></iframe>
    <iframe id="v-routine" class="view" src="routine.html?v=20261108g" title="Routine builder" role="tabpanel" allow="autoplay; screen-wake-lock"></iframe>
    <iframe id="v-settings" class="view" src="settings.html?v=20261108g" title="Settings" role="tabpanel"></iframe>
  </main>

  <nav aria-label="Beatbox tools" id="tabnav">
    <div class="tabs" role="tablist">
      <span class="tab-indicator" id="ind" aria-hidden="true"></span>
      <button role="tab" data-tab="voice" aria-controls="v-voice" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14.5a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 0 0-7 0v5a3.5 3.5 0 0 0 3.5 3.5z"/><path d="M6 10.5a1 1 0 0 1 2 0V11a4 4 0 0 0 8 0v-.5a1 1 0 0 1 2 0V11a6 6 0 0 1-5 5.9V19h2a1 1 0 0 1 0 2H9a1 1 0 0 1 0-2h2v-2.1A6 6 0 0 1 6 11z"/></svg>
        Record
      </button>
      <button role="tab" data-tab="history" aria-controls="v-history" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 3a9 9 0 1 1-8.5 6H1.7a.6.6 0 0 1-.4-1l2.7-3a.6.6 0 0 1 .9 0l2.7 3a.6.6 0 0 1-.4 1H5.6A7 7 0 1 0 12 5zm-1 4.5a1 1 0 0 1 2 0v4.1l2.7 1.6a1 1 0 1 1-1 1.7l-3.2-1.9a1 1 0 0 1-.5-.9z"/></svg>
        History
      </button>
      <button role="tab" data-tab="routine" aria-controls="v-routine" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.3 5.7a1 1 0 0 1 1.4-1.4l.6.6 1.6-1.6a1 1 0 0 1 1.4 1.4l-2.3 2.3a1 1 0 0 1-1.4 0zM3.3 11.7a1 1 0 0 1 1.4-1.4l.6.6 1.6-1.6a1 1 0 0 1 1.4 1.4l-2.3 2.3a1 1 0 0 1-1.4 0zM3.3 17.7a1 1 0 0 1 1.4-1.4l.6.6 1.6-1.6a1 1 0 0 1 1.4 1.4l-2.3 2.3a1 1 0 0 1-1.4 0zM11 5a1 1 0 0 1 1-1h8a1 1 0 0 1 0 2h-8a1 1 0 0 1-1-1zm0 6a1 1 0 0 1 1-1h8a1 1 0 0 1 0 2h-8a1 1 0 0 1-1-1zm0 6a1 1 0 0 1 1-1h8a1 1 0 0 1 0 2h-8a1 1 0 0 1-1-1z"/></svg>
        Routine
      </button>
      <button role="tab" data-tab="settings" aria-controls="v-settings" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        Settings
      </button>
    </div>
  </nav>

  <!-- Tools layer. The tool pages stay loaded while it is closed, so a metronome or a battle round keeps running. -->
  <section class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="ovTitle" aria-hidden="true">
    <div class="ov-bar">
      <button class="top-btn" id="ovClose" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6 10.6 12 5 6.4z"/></svg>
      </button>
      <h2 id="ovTitle">More <span>tools</span></h2>
      <button class="top-btn gone" id="ovList" type="button" aria-label="All tools">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6.5v6.5H4zM13.5 4H20v6.5h-6.5zM4 13.5h6.5V20H4zM13.5 13.5H20V20h-6.5z"/></svg>
      </button>
    </div>
    <div class="ov-body">
      <div class="pane tools on" id="p-list">
        <span class="sl">Practice</span>
        <button class="tool" type="button" data-open="metronome" id="t-metronome">
          <div class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M9.2 2.5h5.6a1 1 0 0 1 1 .8l3.2 16.4a1.6 1.6 0 0 1-1.6 1.9H6.6A1.6 1.6 0 0 1 5 19.7L8.2 3.3a1 1 0 0 1 1-.8zm3.6 6.3a1 1 0 0 0-1.8-.6l-2.1 5.2a1 1 0 1 0 1.9.7l.5-1.3h1.5l-.1 2.2a1 1 0 1 0 2 .1z"/></svg></div>
          <div><b>Metronome</b><small>BPM, accents, subdivisions, tap tempo</small></div>
          <span class="run">Playing</span><span class="go" aria-hidden="true">›</span>
        </button>
        <button class="tool" type="button" data-open="battle" id="t-battle">
          <div class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M9 2.5h6a1 1 0 0 1 0 2h-2v1.6a8.5 8.5 0 1 1-2 0V4.5H9a1 1 0 0 1 0-2zm3 5.6a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zm1 2.4v3.6l2.3 1.4a1 1 0 0 1-1 1.7l-2.8-1.7a1 1 0 0 1-.5-.9v-4.1a1 1 0 0 1 2 0z"/></svg></div>
          <div><b>Battle round</b><small>60 / 120 / 150 / 200 sec with buzzer</small></div>
          <span class="run">Running</span><span class="go" aria-hidden="true">›</span>
        </button>
        <p class="hint">They keep running when you close this, so you can record or rehearse over the metronome. The gold dot on the grid button tells you something is still going.</p>
      </div>
      <iframe id="v-metronome" class="pane" src="metronome.html?v=20261108g" title="Metronome" allow="autoplay; screen-wake-lock"></iframe>
      <iframe id="v-battle" class="pane" src="battle.html?v=20261108g" title="Battle round timer" allow="autoplay; screen-wake-lock"></iframe>
    </div>
  </section>

<script>
(function () {
  var IDS = ['voice', 'history', 'routine', 'settings'];
  var TOOLS = ['metronome', 'battle'];
  var TITLES = { list: 'More <span>tools</span>', metronome: 'Metro<span>nome</span>', battle: 'Battle <span>round</span>' };
  var KEY = 'savior-audio-tools:tab';
  var buttons = Array.prototype.slice.call(document.querySelectorAll('nav button'));
  var ind = document.getElementById('ind');
  var ov = document.getElementById('ov');
  var toolsBtn = document.getElementById('toolsBtn');
  var closeBtn = document.getElementById('ovClose');
  var title = document.getElementById('ovTitle');
  var stage = document.getElementById('stage');
  var tabnav = document.getElementById('tabnav');
  var current = IDS[0];
  var openPane = null, pushed = false;
  var listBtn = document.getElementById('ovList');

  function stored() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function remember(id) { try { localStorage.setItem(KEY, id); } catch (e) {} }
  function show(win) { try { win.postMessage({ type: 'shown' }, location.origin); } catch (e) {} }

  function select(id, focusTab) {
    if (IDS.indexOf(id) === -1) id = IDS[0];
    current = id;
    IDS.forEach(function (name) {
      var view = document.getElementById('v-' + name);
      var on = name === id;
      view.classList.toggle('on', on);
      view.setAttribute('aria-hidden', on ? 'false' : 'true');
      if (on) view.removeAttribute('inert'); else view.setAttribute('inert', '');
      if (on) show(view.contentWindow);
    });
    buttons.forEach(function (b) {
      var on = b.getAttribute('data-tab') === id;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      b.tabIndex = on ? 0 : -1;
      if (on && focusTab) b.focus();
    });
    ind.style.transform = 'translateX(' + (IDS.indexOf(id) * 100) + '%)';
    remember(id);
    if (!openPane) { try { history.replaceState(null, '', '#' + id); } catch (e) {} }
  }

  /* tools layer: pane is 'list', 'metronome' or 'battle'; null closes it */
  function openTools(pane, push) {
    var wasOpen = !!openPane;
    openPane = pane || 'list';
    ['list'].concat(TOOLS).forEach(function (p) {
      var el = document.getElementById(p === 'list' ? 'p-list' : 'v-' + p);
      var on = p === openPane;
      el.classList.toggle('on', on);
      if (on) el.removeAttribute('inert'); else el.setAttribute('inert', '');
    });
    title.innerHTML = TITLES[openPane];
    ov.classList.add('open');
    ov.setAttribute('aria-hidden', 'false');
    toolsBtn.setAttribute('aria-expanded', 'true');
    stage.setAttribute('inert', ''); tabnav.setAttribute('inert', '');
    if (TOOLS.indexOf(openPane) > -1) show(document.getElementById('v-' + openPane).contentWindow);
    listBtn.classList.toggle('gone', openPane === 'list');
    var hash = '#' + (openPane === 'list' ? 'tools' : openPane);
    /* opening from a tap adds one history entry, so the phone's Back button closes the layer */
    try {
      if (push && !wasOpen) { history.pushState(null, '', hash); pushed = true; }
      else history.replaceState(null, '', hash);
    } catch (e) {}
    if (!wasOpen) closeBtn.focus({ preventScroll: true });
  }
  function closeTools() {
    if (!openPane) return;
    openPane = null; pushed = false;
    ov.classList.remove('open');
    ov.setAttribute('aria-hidden', 'true');
    toolsBtn.setAttribute('aria-expanded', 'false');
    stage.removeAttribute('inert'); tabnav.removeAttribute('inert');
    TOOLS.forEach(function (p) { document.getElementById('v-' + p).setAttribute('inert', ''); });
    try { history.replaceState(null, '', '#' + current); } catch (e) {}
    toolsBtn.focus({ preventScroll: true });
    show(document.getElementById('v-' + current).contentWindow);
  }

  function route() {
    var h = location.hash.replace('#', '');
    if (h === 'tools') openTools('list');
    else if (TOOLS.indexOf(h) > -1) openTools(h);
    else { if (openPane) closeTools(); select(h); }
  }

  function requestClose() {
    if (!openPane) return;
    if (pushed) { pushed = false; try { history.back(); return; } catch (e) {} }
    closeTools();
  }
  toolsBtn.addEventListener('click', function () { openTools('list', true); });
  closeBtn.addEventListener('click', requestClose);
  listBtn.addEventListener('click', function () { openTools('list'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') requestClose(); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-open]'), function (b) {
    b.addEventListener('click', function () { openTools(b.getAttribute('data-open')); });
  });

  buttons.forEach(function (b, i) {
    b.addEventListener('click', function () { select(b.getAttribute('data-tab')); });
    b.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      var next = (i + (e.key === 'ArrowRight' ? 1 : -1) + buttons.length) % buttons.length;
      select(buttons[next].getAttribute('data-tab'), true);
    });
  });

  window.addEventListener('hashchange', route);

  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin) return;
    var d = e.data || {};
    if (d.type === 'goto' && IDS.indexOf(d.tab) > -1) { if (openPane) closeTools(); select(d.tab); }
    else if (d.type === 'recording') {
      var rb = document.querySelector('nav button[data-tab="voice"]');
      if (rb) rb.classList.toggle('recording', !!d.on);
    }
  });

  /* a gold dot on the tools button while the metronome plays or a battle round runs */
  function poll() {
    var met = false, bat = false;
    try {
      var m = document.getElementById('v-metronome').contentDocument.getElementById('playBtn');
      met = !!m && /^stop/i.test(m.getAttribute('aria-label') || '');
    } catch (e) {}
    try {
      var b = document.getElementById('v-battle').contentDocument.getElementById('mainBtn');
      bat = !!b && /^pause/i.test((b.textContent || '').trim());
    } catch (e) {}
    document.getElementById('t-metronome').classList.toggle('live', met);
    document.getElementById('t-battle').classList.toggle('live', bat);
    toolsBtn.classList.toggle('live', met || bat);
  }
  setInterval(poll, 500);

  /* installable app: keep the install prompt for the Settings tab, and register the offline worker */
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); window.__installPrompt = e;
    try { document.getElementById('v-settings').contentWindow.postMessage({ type: 'shown' }, location.origin); } catch (x) {}
  });
  window.addEventListener('appinstalled', function () {
    window.__installPrompt = null;
    try { document.getElementById('v-settings').contentWindow.postMessage({ type: 'shown' }, location.origin); } catch (x) {}
  });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }

  TOOLS.forEach(function (p) { document.getElementById('v-' + p).setAttribute('inert', ''); });
  var h0 = location.hash.replace('#', '');
