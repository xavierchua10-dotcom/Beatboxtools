<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#09070d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Savior Audio Tools">
<title>Savior Audio Tools</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#09070d;
    --panel:#131019;
    --edge:#201a2c;
    --violet:#9163f9;
    --magenta:#ff2e88;
    --dim:#8d8998;
    --bar:62px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  body{
    display:flex;flex-direction:column;
    height:100vh;height:100dvh;
    font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:#f4f2f8;
  }
  .stage{position:relative;flex:1;min-height:0;margin-top:env(safe-area-inset-top)}
  .view{
    position:absolute;inset:0;width:100%;height:100%;border:0;
    background:var(--bg);
    visibility:hidden;pointer-events:none;
  }
  .view.on{visibility:visible;pointer-events:auto}
  nav{
    display:flex;flex:none;
    background:var(--panel);
    border-top:1px solid var(--edge);
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{
    position:relative;flex:1;height:var(--bar);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    background:none;border:0;border-radius:0;cursor:pointer;
    color:var(--dim);
    font-family:inherit;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
    touch-action:manipulation;-webkit-user-select:none;user-select:none;
    transition:color 160ms ease;
  }
  nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  nav button[aria-selected="true"]{color:var(--magenta)}
  nav button[aria-selected="true"]::before{
    content:"";position:absolute;top:-1px;left:32%;right:32%;height:2px;
    background:linear-gradient(90deg,var(--violet),var(--magenta));border-radius:0 0 2px 2px;
  }
  nav button:focus-visible{outline:2px solid var(--violet);outline-offset:-4px}
</style>
</head>
<body>
  <main class="stage">
    <iframe id="v-metronome" class="view" src="metronome.html" title="Metronome" role="tabpanel" allow="autoplay; screen-wake-lock"></iframe>
    <iframe id="v-battle" class="view" src="battle.html" title="Battle round timer" role="tabpanel" allow="autoplay; screen-wake-lock"></iframe>
  </main>

  <nav role="tablist" aria-label="Savior audio tools">
    <button role="tab" data-tab="metronome" aria-controls="v-metronome" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 3h7l3 17.5h-13z"/><path d="M12 16.5 15.5 7"/><path d="M9.5 12.5h4"/></svg>
      Metronome
    </button>
    <button role="tab" data-tab="battle" aria-controls="v-battle" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5"/><path d="M10 3h4"/><path d="m18.5 6 1.2-1.2"/></svg>
      Battle
    </button>
  </nav>

<script>
(function () {
  var IDS = ['metronome', 'battle'];
  var KEY = 'savior-audio-tools:tab';
  var buttons = Array.prototype.slice.call(document.querySelectorAll('nav button'));

  function stored() {
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  }
  function remember(id) {
    try { localStorage.setItem(KEY, id); } catch (e) {}
  }

  function select(id, focusTab) {
    if (IDS.indexOf(id) === -1) id = IDS[0];
    IDS.forEach(function (name) {
      var view = document.getElementById('v-' + name);
      var on = name === id;
      view.classList.toggle('on', on);
      view.setAttribute('aria-hidden', on ? 'false' : 'true');
      if (on) view.removeAttribute('inert'); else view.setAttribute('inert', '');
    });
    buttons.forEach(function (b) {
      var on = b.getAttribute('data-tab') === id;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      b.tabIndex = on ? 0 : -1;
      if (on && focusTab) b.focus();
    });
    remember(id);
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
  }

  buttons.forEach(function (b, i) {
    b.addEventListener('click', function () { select(b.getAttribute('data-tab')); });
    b.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      var next = (i + (e.key === 'ArrowRight' ? 1 : -1) + buttons.length) % buttons.length;
      select(buttons[next].getAttribute('data-tab'), true);
    });
  });

  window.addEventListener('hashchange', function () {
    select(location.hash.replace('#', ''));
  });

  select(location.hash.replace('#', '') || stored() || IDS[0]);
})();
</script>
</body>
</html>
