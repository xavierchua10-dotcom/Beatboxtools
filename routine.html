<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Routine builder by Savior</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fonts.css?v=20261108e">
<link rel="stylesheet" href="theme.css?v=20261108e">
<style>
  .card{margin-bottom:12px}
  .lab{display:block;margin:0 0 8px;color:var(--text-faint);font:500 12px var(--f-head);letter-spacing:.12em;text-transform:uppercase}
  .row{display:flex;align-items:center;gap:8px}
  .row.wrap{flex-wrap:wrap}
  input[type=number]{-moz-appearance:textfield;appearance:textfield}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  textarea{resize:none;font:400 14px/1.4 var(--f-body)}
  select{font:500 14px var(--f-mono)}
  #rname{margin-top:8px;font-family:var(--f-body);font-weight:600}
  .btn.sm{min-height:42px;padding:9px 12px;font-size:12px;flex:none}
  .btn.wide{width:100%}
  details.tpl{margin-top:10px}
  details.tpl summary{color:var(--accent);font:600 12px var(--f-head);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;padding:6px 0}
  details.tpl .row{margin-top:6px}
  .meter{margin-top:14px}
  .bar{height:10px;background:var(--panel-3);border-radius:6px;overflow:hidden}
  .bar>div{height:100%;width:0;background:linear-gradient(90deg,#b8841f,var(--accent));border-radius:6px;transition:width 160ms ease}
  .meter.over .bar>div{background:var(--accent-2)}
  #meterText{margin-top:8px;color:var(--text-dim);font:500 13px var(--f-mono)}
  .meter.over #meterText{color:var(--accent-2)}
  .sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
  .sec-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .idx{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:rgba(var(--accent-rgb),.12);border:1px solid var(--accent-dim);color:var(--accent);font:700 12px var(--f-mono)}
  .range{flex:none;color:var(--text-dim);font:400 12px var(--f-mono)}
  .sec-body{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .stepper{display:flex;align-items:center;gap:4px}
  .stepper button,.acts button{
    flex:none;width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);
    display:grid;place-items:center;font-size:20px;line-height:1;padding:0;
  }
  .stepper input{width:56px;text-align:center;font:600 16px var(--f-mono);padding:9px 2px}
  .stepper span{color:var(--text-dim);font-size:13px;padding:0 2px}
  .acts{display:flex;gap:4px;margin-left:auto}
  .acts button{width:34px;height:34px;color:var(--text-dim)}
  .acts svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .acts button.armed{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
  .empty{color:var(--text-dim);font-size:14px;text-align:center;padding:18px 8px}
  #quick{margin:6px 0 12px}
  .actions{display:flex;gap:10px;margin-top:12px}
  .actions .btn{flex:1}
  .msg{min-height:20px;margin:10px 0 0;text-align:center;color:var(--text-dim);font-size:13px}

  .reh{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;padding:20px 16px 24px;background:var(--bg)}
  .reh[hidden]{display:none}
  .reh-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .reh-name{color:var(--text-faint);font:500 12px var(--f-head);letter-spacing:.12em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .reh-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;min-height:0}
  .reh-label{margin:0;font:700 34px/1.1 var(--f-head);letter-spacing:.06em;text-transform:uppercase;max-width:100%;overflow-wrap:anywhere}
  .reh-time{margin:0;font:700 128px/1 var(--f-head);color:var(--accent)}
  .reh-time.urgent{color:var(--accent-2)}
  .reh-notes{margin:6px 0 0;color:var(--text-dim);font-size:15px;line-height:1.4;max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere}
  .reh-meta{display:flex;justify-content:space-between;gap:12px;margin:10px 0 16px;color:var(--text-dim);font:400 13px var(--f-mono)}
  .reh-meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .reh .btn.big{width:100%;min-height:54px;font-size:16px}
</style>
</head>
<body>
<main class="app">
  <h1 class="page-title">Routine <span>builder</span></h1>
  <p class="page-tag">by savior</p>

  <section class="card">
    <label class="lab" for="pick">Routine</label>
    <div class="row">
      <select id="pick" aria-label="Choose routine"></select>
      <button id="dupR" class="btn sm" type="button">Duplicate</button>
      <button id="delR" class="btn sm" type="button">Delete</button>
    </div>
    <input id="rname" type="text" maxlength="60" placeholder="Routine name" aria-label="Routine name">
    <details class="tpl" id="tpl">
      <summary>New routine</summary>
      <div class="row wrap">
        <button class="chip" type="button" data-tpl="blank">Blank</button>
        <button class="chip" type="button" data-tpl="wildcard">60s wildcard</button>
        <button class="chip" type="button" data-tpl="round">120s round</button>
      </div>
    </details>
  </section>

  <section class="card">
    <span class="lab">Target length</span>
    <div class="row wrap" id="tchips"></div>
    <div class="row" style="margin-top:10px">
      <input id="target" type="number" inputmode="numeric" min="5" max="3600" aria-label="Target seconds" style="width:96px">
      <span style="color:var(--text-dim);font-size:13px">sec</span>
    </div>
    <div class="meter" id="meter">
      <div class="bar"><div id="fill"></div></div>
      <div id="meterText"></div>
    </div>
  </section>

  <div id="list"></div>
  <div class="row wrap" id="quick">
    <button class="chip" type="button" data-name="Intro">+ Intro</button>
    <button class="chip" type="button" data-name="Build">+ Build</button>
    <button class="chip" type="button" data-name="Drop">+ Drop</button>
    <button class="chip" type="button" data-name="Tricks">+ Tricks</button>
    <button class="chip" type="button" data-name="Outro">+ Outro</button>
  </div>
  <button id="add" class="btn wide" type="button">+ Add section</button>

  <div class="actions">
    <button id="rehearse" class="btn primary" type="button">Rehearse</button>
    <button id="copy" class="btn" type="button">Copy as text</button>
  </div>
  <p id="msg" class="msg" role="status" aria-live="polite"></p>
</main>

<section id="reh" class="reh" hidden aria-label="Rehearsal">
  <div class="reh-top">
    <span id="rehName" class="reh-name"></span>
    <button id="rehStop" class="btn sm" type="button">Stop</button>
  </div>
  <div class="reh-mid">
    <p id="rehLabel" class="reh-label" aria-live="polite">Get ready</p>
    <p id="rehTime" class="reh-time">3</p>
    <p id="rehNotes" class="reh-notes"></p>
  </div>
  <div>
    <div class="bar"><div id="rehBar"></div></div>
    <div class="reh-meta"><span id="rehNext"></span><span id="rehLeft"></span></div>
    <button id="rehPause" class="btn primary big" type="button">Pause</button>
  </div>
</section>

<script>
(function () {
  'use strict';
  var KEY = 'savior-routines-v1';
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var uid = function () { return Math.random().toString(36).slice(2, 9); };
  var clamp = function (n, a, b) { return Math.min(b, Math.max(a, n)); };

  function fmt(s) {
    s = Math.max(0, Math.round(s));
    var m = Math.floor(s / 60), r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  function totalOf(r) { return r.sections.reduce(function (a, s) { return a + s.sec; }, 0); }

  function mk(name, target, secs) {
    return {
      id: uid(), name: name, target: target,
      sections: secs.map(function (s) { return { id: uid(), name: s[0], sec: s[1], notes: s[2] || '' }; })
    };
  }
  var TPL = {
    blank: function () { return mk('New routine', 60, []); },
    wildcard: function () {
      return mk('60s wildcard', 60, [
        ['Intro', 8, 'Hook sound, name drop'], ['Build', 12], ['Showcase', 15],
        ['Drop', 12], ['Tricks', 8], ['Outro', 5]
      ]);
    },
    round: function () {
      return mk('120s round', 120, [
        ['Opening', 15], ['Style one', 25], ['Drops', 20],
        ['Showcase', 25], ['Tricks', 20], ['Close', 15]
      ]);
    }
  };

  function clean(s) {
    s.routines = (Array.isArray(s.routines) ? s.routines : []).filter(Boolean).map(function (r) {
      return {
        id: String(r.id || uid()),
        name: String(r.name || 'Routine').slice(0, 60),
        target: clamp(parseInt(r.target, 10) || 60, 5, 3600),
        sections: (Array.isArray(r.sections) ? r.sections : []).filter(Boolean).map(function (x) {
          return {
            id: String(x.id || uid()),
            name: String(x.name || '').slice(0, 40),
            sec: clamp(parseInt(x.sec, 10) || 1, 1, 3600),
            notes: String(x.notes || '').slice(0, 300)
          };
        })
      };
    });
    if (!s.routines.length) s.routines = [TPL.wildcard()];
    if (!s.routines.some(function (r) { return r.id === s.currentId; })) s.currentId = s.routines[0].id;
    return s;
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) return clean(JSON.parse(raw));
    } catch (e) {}
    var r = TPL.wildcard();
    return { routines: [r], currentId: r.id };
  }
  var state = load();
  var saveT;
  function save() {
    clearTimeout(saveT);
    saveT = setTimeout(function () {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    }, 200);
  }
  function cur() {
    return state.routines.filter(function (r) { return r.id === state.currentId; })[0];
  }
  var msgT;
  function say(t) {
    $('#msg').textContent = t;
    clearTimeout(msgT);
    msgT = setTimeout(function () { $('#msg').textContent = ''; }, 2600);
  }
  function arm(btn, fn) {
    if (btn.dataset.armed === '1') {
      clearTimeout(btn._t); btn.dataset.armed = '0'; btn.classList.remove('armed'); fn(); return;
    }
    btn.dataset.armed = '1'; btn.classList.add('armed');
    var old = btn.textContent;
    if (btn.textContent) btn.textContent = 'Tap again';
    btn._t = setTimeout(function () {
      btn.dataset.armed = '0'; btn.classList.remove('armed');
      if (old) btn.textContent = old;
    }, 2500);
  }

  var SEC_HTML =
    '<div class="sec-head"><span class="idx"></span>' +
    '<input class="sname" type="text" maxlength="40" aria-label="Section name">' +
    '<span class="range"></span></div>' +
    '<div class="sec-body"><div class="stepper">' +
    '<button type="button" data-act="dec" aria-label="Shorter">−</button>' +
    '<input class="ssec" type="number" inputmode="numeric" min="1" max="3600" aria-label="Seconds">' +
    '<span>sec</span>' +
    '<button type="button" data-act="inc" aria-label="Longer">+</button></div>' +
    '<div class="acts">' +
    '<button type="button" data-act="up" aria-label="Move up"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>' +
    '<button type="button" data-act="down" aria-label="Move down"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>' +
    '<button type="button" data-act="dup" aria-label="Duplicate section"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button>' +
    '<button type="button" data-act="del" aria-label="Delete section"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>' +
    '</div></div>' +
    '<textarea class="snotes" rows="2" maxlength="300" placeholder="Sounds, tricks, ideas" aria-label="Notes"></textarea>';

  function renderPicker() {
    var sel = $('#pick');
    sel.textContent = '';
    state.routines.forEach(function (r) {
      var o = document.createElement('option');
      o.value = r.id; o.textContent = r.name || 'Untitled';
      sel.appendChild(o);
    });
    sel.value = state.currentId;
    $('#rname').value = cur().name;
  }
  function renderChips() {
    var r = cur(), box = $('#tchips');
    box.textContent = '';
    [60, 90, 120, 150, 200].forEach(function (v) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip' + (r.target === v ? ' on' : '');
      b.dataset.sec = v; b.textContent = v + ' sec';
      box.appendChild(b);
    });
  }
  function renderList() {
    var r = cur(), box = $('#list');
    box.textContent = '';
    if (!r.sections.length) {
      var p = document.createElement('p');
      p.className = 'empty'; p.textContent = 'No sections yet. Add your first one below.';
      box.appendChild(p);
    }
    r.sections.forEach(function (s, i) {
      var el = document.createElement('div');
      el.className = 'sec'; el.dataset.id = s.id; el.innerHTML = SEC_HTML;
      $('.idx', el).textContent = i + 1;
      var nm = $('.sname', el); nm.value = s.name; nm.placeholder = 'Section ' + (i + 1);
      $('.ssec', el).value = s.sec;
      $('.snotes', el).value = s.notes;
      box.appendChild(el);
    });
    updateDerived();
  }
  function updateDerived() {
    var r = cur(), t = 0, els = document.querySelectorAll('#list .sec');
    r.sections.forEach(function (s, i) {
      var a = t; t += s.sec;
      if (els[i]) $('.range', els[i]).textContent = fmt(a) + ' - ' + fmt(t);
    });
    var diff = r.target - t;
    $('#fill').style.width = Math.min(100, r.target > 0 ? (t / r.target) * 100 : 0) + '%';
    $('#meter').classList.toggle('over', diff < 0);
    $('#meterText').textContent = fmt(t) + ' of ' + fmt(r.target) + ' · ' +
      (diff === 0 ? 'on target' : diff > 0 ? fmt(diff) + ' left' : fmt(-diff) + ' over');
  }
  function renderAll() {
    renderPicker(); renderChips();
    $('#target').value = cur().target;
    renderList();
  }

  function secById(id) {
    var r = cur();
    for (var i = 0; i < r.sections.length; i++) if (r.sections[i].id === id) return i;
    return -1;
  }
  function swap(a, i, j) { var t = a[i]; a[i] = a[j]; a[j] = t; }
  function addSection(name) {
    cur().sections.push({ id: uid(), name: name || '', sec: 8, notes: '' });
    renderList(); save();
    var els = document.querySelectorAll('#list .sec');
    var last = els[els.length - 1];
    if (last && last.scrollIntoView) last.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  $('#list').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-act]');
    if (!b) return;
    var el = b.closest('.sec'), r = cur(), i = secById(el.dataset.id);
    if (i < 0) return;
    var act = b.dataset.act, s = r.sections[i];
    if (act === 'inc' || act === 'dec') {
      s.sec = clamp(s.sec + (act === 'inc' ? 1 : -1), 1, 3600);
      $('.ssec', el).value = s.sec; updateDerived(); save();
    } else if (act === 'up' && i > 0) {
      swap(r.sections, i, i - 1); renderList(); save();
    } else if (act === 'down' && i < r.sections.length - 1) {
      swap(r.sections, i, i + 1); renderList(); save();
    } else if (act === 'dup') {
      r.sections.splice(i + 1, 0, { id: uid(), name: s.name, sec: s.sec, notes: s.notes });
      renderList(); save();
    } else if (act === 'del') {
      arm(b, function () { r.sections.splice(i, 1); renderList(); save(); });
    }
  });
  $('#list').addEventListener('input', function (e) {
    var t = e.target, el = t.closest('.sec');
    if (!el) return;
    var i = secById(el.dataset.id);
    if (i < 0) return;
    var s = cur().sections[i];
    if (t.classList.contains('sname')) s.name = t.value;
    else if (t.classList.contains('snotes')) s.notes = t.value;
    else if (t.classList.contains('ssec')) {
      var n = parseInt(t.value, 10);
      if (n >= 1) { s.sec = clamp(n, 1, 3600); updateDerived(); }
    }
    save();
  });
  $('#list').addEventListener('focusout', function (e) {
    var t = e.target;
    if (t.classList && t.classList.contains('ssec')) {
      var el = t.closest('.sec'), i = el ? secById(el.dataset.id) : -1;
      if (i >= 0) t.value = cur().sections[i].sec;
    }
  });

  $('#pick').addEventListener('change', function () {
    state.currentId = this.value; renderAll(); save();
  });
  $('#rname').addEventListener('input', function () {
    var r = cur(); r.name = this.value;
    var opts = $('#pick').options;
    for (var i = 0; i < opts.length; i++) if (opts[i].value === r.id) opts[i].textContent = r.name || 'Untitled';
    save();
  });
  $('#tpl').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tpl]');
    if (!b) return;
    var r = TPL[b.dataset.tpl]();
    state.routines.push(r); state.currentId = r.id;
    this.open = false; renderAll(); save();
  });
  $('#dupR').addEventListener('click', function () {
    var r = cur();
    var c = {
      id: uid(), name: (r.name + ' copy').slice(0, 60), target: r.target,
      sections: r.sections.map(function (s) { return { id: uid(), name: s.name, sec: s.sec, notes: s.notes }; })
    };
    state.routines.push(c); state.currentId = c.id; renderAll(); save();
  });
  $('#delR').addEventListener('click', function () {
    arm(this, function () {
      state.routines = state.routines.filter(function (r) { return r.id !== state.currentId; });
      if (!state.routines.length) state.routines.push(TPL.wildcard());
      state.currentId = state.routines[0].id;
      renderAll(); save();
    });
  });
  $('#tchips').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-sec]');
    if (!b) return;
    cur().target = parseInt(b.dataset.sec, 10);
    $('#target').value = cur().target; renderChips(); updateDerived(); save();
  });
  $('#target').addEventListener('input', function () {
    var n = parseInt(this.value, 10);
    if (n >= 5) { cur().target = clamp(n, 5, 3600); renderChips(); updateDerived(); save(); }
  });
  $('#target').addEventListener('change', function () { this.value = cur().target; });
  $('#quick').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-name]');
    if (b) addSection(b.dataset.name);
  });
  $('#add').addEventListener('click', function () { addSection(''); });

  function textOf(r) {
    var t = 0;
    var lines = [r.name + ' (' + fmt(totalOf(r)) + ' of ' + fmt(r.target) + ')'];
    r.sections.forEach(function (s, i) {
      var a = t; t += s.sec;
      lines.push(fmt(a) + '-' + fmt(t) + '  ' + (s.name || 'Section ' + (i + 1)) + ' (' + s.sec + 's)' + (s.notes ? ' - ' + s.notes : ''));
    });
    return lines.join('\n');
  }
  $('#copy').addEventListener('click', function () {
    var txt = textOf(cur());
    function ok() { say('Copied to clipboard'); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var done = false;
      try { done = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      say(done ? 'Copied to clipboard' : 'Could not copy on this browser');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fallback);
    else fallback();
  });

  var run = null, ac = null, wl = null;
  /* rehearsal options come from the Settings tab */
  function opts() {
    var o = {};
    try { o = JSON.parse(localStorage.getItem('savior-settings-v1')) || {}; } catch (e) {}
    return { countIn: [0, 3, 5, 10].indexOf(o.countIn) > -1 ? o.countIn : 3, beeps: o.beeps !== false, vibrate: o.vibrate !== false };
  }
  var cfg = opts();
  function beep(freq, dur, vol) {
    if (!ac || !cfg.beeps) return;
    try {
      var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.25, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  function buzz(p) { try { if (cfg.vibrate && navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
  function lock() {
    try {
      if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (l) { wl = l; }, function () {});
    } catch (e) {}
  }
  function unlock() { try { if (wl) { wl.release(); wl = null; } } catch (e) {} }

  function ui(label, time, notes, next, left, pct, urgent) {
    $('#rehLabel').textContent = label;
    $('#rehTime').textContent = time;
    $('#rehTime').classList.toggle('urgent', !!urgent);
    $('#rehNotes').textContent = notes;
    $('#rehNext').textContent = next;
    $('#rehLeft').textContent = left;
    $('#rehBar').style.width = pct + '%';
  }
  function stopRun() {
    if (run) clearInterval(run.timer);
    run = null; unlock();
    $('#reh').hidden = true;
  }
  function segAt(p) {
    for (var i = 0; i < run.segs.length; i++) if (p < run.segs[i].end) return i;
    return run.segs.length - 1;
  }
  function tick() {
    if (!run) return;
    var now = performance.now(), dt = (now - run.last) / 1000;
    run.last = now;
    if (run.paused || run.done) return;
    run.pos += dt;
    var p = run.pos;
    if (p < 0) {
      var n = Math.ceil(-p);
      if (run.whole !== n) { run.whole = n; beep(660, 0.12, 0.2); buzz(20); }
      ui('Get ready', String(n), '', 'First: ' + run.segs[0].name, fmt(run.total) + ' total', 0, false);
      return;
    }
    if (p >= run.total) {
      run.done = true;
      beep(880, 0.9, 0.3); buzz([80, 60, 80]);
      ui('Routine complete', fmt(run.total), '', 'Nice one', '0:00 left', 100, false);
      $('#rehPause').textContent = 'Close';
      unlock();
      return;
    }
    var i = segAt(p), sg = run.segs[i], changed = false;
    if (i !== run.seg) { run.seg = i; run.rem = null; changed = true; beep(990, 0.25, 0.3); buzz(40); }
    var rem = Math.ceil(sg.end - p);
    if (rem !== run.rem) {
      run.rem = rem;
      if (!changed && rem >= 1 && rem <= 3) beep(660, 0.1, 0.2);
    }
    ui(sg.name, rem >= 60 ? fmt(rem) : String(rem), sg.notes,
       i + 1 < run.segs.length ? 'Next: ' + run.segs[i + 1].name : 'Last section',
       fmt(Math.ceil(run.total - p)) + ' left', (p / run.total) * 100, rem <= 3);
  }
  function startRehearse() {
    var r = cur();
    if (!r.sections.length) { say('Add a section first'); return; }
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
    var segs = [], t = 0;
    r.sections.forEach(function (s, i) {
      segs.push({ name: s.name || 'Section ' + (i + 1), notes: s.notes, start: t, end: t + s.sec });
      t += s.sec;
    });
    cfg = opts();
    run = { segs: segs, total: t, pos: -cfg.countIn, last: performance.now(), paused: false, done: false, seg: -1, rem: null, whole: null };
    $('#rehName').textContent = r.name || 'Routine';
    $('#rehPause').textContent = 'Pause';
    $('#reh').hidden = false;
    lock();
    run.timer = setInterval(tick, 100);
    tick();
  }
  $('#rehearse').addEventListener('click', startRehearse);
  $('#rehStop').addEventListener('click', stopRun);
  $('#rehPause').addEventListener('click', function () {
    if (!run) return;
    if (run.done) { stopRun(); return; }
    run.paused = !run.paused;
    this.textContent = run.paused ? 'Resume' : 'Pause';
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && run) stopRun(); });

  renderAll();
})();
</script>
</body>
</html>
