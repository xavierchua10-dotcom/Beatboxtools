<!DOCTYPE html>
<html lang="en">
<head>
<script src="theme.js?v=20261109j"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Routine builder by Savior</title>
<link rel="stylesheet" href="fonts.css?v=20261109j">
<link rel="stylesheet" href="theme.css?v=20261109j">
<link rel="stylesheet" href="themes.css?v=20261109j">
<style>
  :root{--ls:color-mix(in srgb,var(--text) 16%,var(--line))}
  .app{padding-bottom:104px}
  svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  input[type=number]{-moz-appearance:textfield;appearance:textfield}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  textarea{resize:none;font:400 14px/1.5 var(--f-body)}
  .lab{display:block;margin:0;color:var(--text-faint);font:500 10px var(--f-mono);letter-spacing:.2em;text-transform:uppercase}

  /* header card */
  .rh{padding:14px;margin-bottom:0;border-color:rgba(var(--accent-rgb),.3);background:radial-gradient(circle at 105% -20%,rgba(var(--accent-rgb),.2),transparent 55%),var(--panel);border-radius:16px}
  .r1{display:flex;align-items:center;gap:8px}
  #rname{flex:1;min-width:0;background:transparent;border:1px solid transparent;border-radius:10px;padding:4px 8px;margin-left:-8px;min-height:40px;font:700 22px var(--f-head);letter-spacing:.06em;text-transform:uppercase;text-overflow:ellipsis}
  #rname:focus{background:var(--panel-3);border-color:var(--accent)}
  #pickBtn{width:auto;min-width:40px;height:40px;padding:0 10px;gap:6px;display:flex;align-items:center;color:var(--accent-ink);font:600 11px var(--f-mono);letter-spacing:.06em}
  #pickBtn svg{width:18px;height:18px}
  .tl{display:flex;gap:3px;margin-top:14px;height:30px}
  .tl button{flex:1 1 0;min-width:0;padding:0;border:0;border-radius:7px;background:rgba(var(--accent-rgb),.55);color:var(--on-accent);font:700 12px var(--f-head);overflow:hidden;transition:flex-grow .2s}
  .tl button:nth-child(even){background:var(--accent)}
  .tl button.sel{outline:2px solid var(--text);outline-offset:2px}
  .tl .none{flex:1;border:1.5px dashed var(--ls);border-radius:7px;display:grid;place-items:center;color:var(--text-faint);font:500 11px var(--f-mono);letter-spacing:.1em}
  .tmeta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
  .tm{font:700 18px var(--f-head);letter-spacing:.04em}
  .tm span{color:var(--text-dim);font:500 13px var(--f-mono)}
  .badge{height:24px;padding:0 9px;border-radius:7px;display:flex;align-items:center;gap:5px;font:600 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;
    color:var(--success);background:color-mix(in srgb,var(--success) 14%,transparent);border:1px solid color-mix(in srgb,var(--success) 42%,transparent)}
  .badge.left{color:var(--accent-ink);background:rgba(var(--accent-rgb),.12);border-color:rgba(var(--accent-rgb),.4)}
  .badge.over{color:var(--accent-2);background:color-mix(in srgb,var(--accent-2) 14%,transparent);border-color:color-mix(in srgb,var(--accent-2) 45%,transparent)}
  .tgt{display:flex;gap:6px;margin-top:12px}
  .tgt button,.tgt input{flex:1 1 0;min-width:0;height:32px;min-height:0;padding:0;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--text-dim);font:600 11px var(--f-mono);text-align:center}
  .tgt button.on,.tgt input.on{border-color:var(--accent);color:var(--accent-ink);background:rgba(var(--accent-rgb),.1)}
  .tgt input{flex:1.25 1 0;font-size:12px;background:var(--panel-3)}
  .tgt input::placeholder{color:var(--text-faint)}

  .sechd{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 8px}

  /* section rows */
  .sec{position:relative;margin-bottom:8px;border-radius:16px;background:var(--panel);border:1px solid var(--line);padding:0}
  .sec::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
  .sec-hit{display:flex;align-items:center;gap:12px;width:100%;padding:12px 12px 12px 16px;background:none;border:0;color:inherit;text-align:left;min-height:58px;border-radius:16px}
  .num{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:rgba(var(--accent-rgb),.14);border:1px solid rgba(var(--accent-rgb),.4);color:var(--accent-ink);font:700 13px var(--f-head)}
  .nm{flex:1;min-width:0}
  .nm b{display:block;font:600 16px var(--f-head);letter-spacing:.06em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nm b.ph{color:var(--text-faint)}
  .nm small{display:block;margin-top:1px;font-size:12px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dur{flex:none;font:500 13px var(--f-mono);color:var(--text-dim)}
  .chev{color:var(--text-faint)}
  .sec.exp{border-color:rgba(var(--accent-rgb),.4);padding:14px 14px 14px 16px}
  .sec.exp::before{top:12px;bottom:12px}
  .eh{display:flex;align-items:center;gap:10px}
  .sname{flex:1;min-width:0;height:42px;font:600 16px var(--f-head)!important;letter-spacing:.06em;text-transform:uppercase}
  .ib.collapse{flex:none;width:42px;height:42px;color:var(--accent-ink)}
  .step{display:flex;align-items:center;gap:10px;margin-top:12px}
  .sb{flex:none;width:46px;height:46px;border-radius:12px;background:var(--panel-2);border:1px solid var(--ls);color:var(--text);font:500 22px var(--f-mono);display:grid;place-items:center;padding:0}
  .sb:active{background:var(--panel-3)}
  .sv{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;height:46px;border-radius:12px;background:var(--panel-3);border:1px solid var(--line)}
  .sv:focus-within{border-color:var(--accent)}
  .ssec{width:64px!important;min-height:0!important;height:40px;text-align:center;background:transparent!important;border:0!important;padding:0!important;font:700 22px var(--f-head)!important}
  .sv span{font:500 12px var(--f-mono);color:var(--text-dim)}
  .range{margin-top:8px;text-align:center;color:var(--text-faint);font:400 12px var(--f-mono);letter-spacing:.06em}
  .snotes{margin-top:10px;min-height:64px}
  .acts{display:flex;gap:8px;margin-top:12px}
  .acts button{flex:1;min-width:0;height:40px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);display:flex;align-items:center;justify-content:center;gap:5px;font:600 10px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:0}
  .acts button svg{width:15px;height:15px}
  .acts button:disabled{opacity:.35}
  .acts button.d{color:var(--accent-2);border-color:var(--accent-2-dim)}
  .empty{color:var(--text-dim);font-size:14px;text-align:center;padding:16px 8px 8px}
  .add{width:100%;height:46px;margin-top:2px;border-radius:14px;border:1.5px dashed var(--ls);background:transparent;color:var(--text-dim);display:flex;align-items:center;justify-content:center;gap:8px;font:600 13px var(--f-head);letter-spacing:.08em;text-transform:uppercase}
  .add:active{background:var(--panel)}
  #quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  #quick .chip{min-height:30px;padding:4px 10px;font-size:10px}

  /* dock */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:22px 16px 12px;background:linear-gradient(transparent,var(--bg) 40%);pointer-events:none}
  .dock-in{max-width:480px;margin:0 auto;display:flex;gap:10px;pointer-events:auto}
  #rehearse{flex:1;height:52px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;gap:10px;font:700 17px var(--f-head);letter-spacing:.1em;text-transform:uppercase;box-shadow:0 8px 24px rgba(var(--accent-rgb),.28)}
  #rehearse svg{width:18px;height:18px;fill:currentColor;stroke:none}
  #copy{flex:none;width:52px;height:52px;border-radius:14px;background:var(--panel-2);border:1px solid var(--ls);color:var(--text-dim);display:grid;place-items:center;padding:0}
  #copy svg{width:20px;height:20px}
  .msg{position:fixed;left:50%;bottom:80px;transform:translate(-50%,8px);z-index:12;max-width:86%;padding:9px 14px;border-radius:10px;background:var(--panel-3);border:1px solid var(--ls);color:var(--text);font:500 13px var(--f-body);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;text-align:center}
  .msg.show{opacity:1;transform:translate(-50%,0)}

  /* routines sheet */
  .scrim{position:fixed;inset:0;z-index:30;background:rgba(8,9,11,.66);opacity:0;transition:opacity .2s}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:480px;margin:0 auto;max-height:86%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:10px 14px 18px;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
  .scrim[hidden],.sheet[hidden]{display:none}
  body.sheet-on .scrim{opacity:1}
  body.sheet-on .sheet{transform:none}
  .grab{width:40px;height:4px;border-radius:2px;background:var(--ls);margin:0 auto 12px}
  .sheet h2{margin:0 0 12px;text-align:center;font:700 20px var(--f-head);letter-spacing:.1em;text-transform:uppercase}
  .sheet h2 i{color:var(--accent-ink);font-style:normal}
  .ri{display:flex;align-items:center;gap:12px;width:100%;padding:12px;margin-bottom:8px;border-radius:14px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);text-align:left}
  .ri.on{border-color:var(--accent);background:rgba(var(--accent-rgb),.08)}
  .ri .t{flex:1;min-width:0}
  .ri b{display:block;font:600 15px var(--f-head);letter-spacing:.06em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ri small{display:block;margin-top:2px;font:500 11px var(--f-mono);color:var(--text-faint)}
  .mini{display:flex;gap:2px;width:64px;flex:none}
  .mini i{height:8px;border-radius:2px;background:rgba(var(--accent-rgb),.6);min-width:1px}
  .mini i:nth-child(even){background:var(--accent)}
  .rad{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--ls);display:grid;place-items:center}
  .ri.on .rad{border-color:var(--accent)}
  .ri.on .rad::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
  .two button{height:44px;border-radius:12px;border:1px solid var(--ls);background:var(--panel-2);color:var(--text);display:flex;align-items:center;justify-content:center;gap:7px;font:600 12px var(--f-head);letter-spacing:.08em;text-transform:uppercase;padding:0}
  .two button svg{width:15px;height:15px;color:var(--accent-ink)}
  .two button.d{color:var(--accent-2);border-color:var(--accent-2-dim)}
  .two button.d svg{color:var(--accent-2)}
  #tplRow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  #tplRow[hidden]{display:none}

  /* rehearsal */
  .reh{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);--rs:min(250px,34dvh,76vw)}
  .reh[hidden]{display:none}
  .glow{position:absolute;left:50%;top:40px;width:520px;height:520px;transform:translateX(-50%);background:radial-gradient(circle,rgba(var(--accent-rgb),.18),transparent 62%);pointer-events:none}
  .rtop{position:relative;display:flex;align-items:center;gap:10px;padding:12px 14px}
  .nmr{flex:1;min-width:0;font:500 11px var(--f-mono);letter-spacing:.18em;color:var(--text-faint);text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stop{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:10px;background:var(--panel-2);border:1px solid var(--ls);color:var(--text);font:700 12px var(--f-head);letter-spacing:.1em;text-transform:uppercase}
  .stop svg{width:12px;height:12px;fill:currentColor;stroke:none}
  .prog{position:relative;display:flex;gap:4px;padding:0 14px}
  .prog div{flex:1 1 0;min-width:2px;height:6px;border-radius:3px;background:var(--panel-3);overflow:hidden}
  .prog i{display:block;height:100%;width:0;background:var(--accent)}
  .rmid{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 14px}
  .ringw{position:relative;width:var(--rs);height:var(--rs);flex:none}
  .ringw svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  .ringw circle{fill:none;stroke-width:12}
  .trk{stroke:var(--panel-3)}
  #rehArc{stroke:var(--accent);stroke-linecap:round;transition:stroke .2s}
  .ringw.urgent #rehArc{stroke:var(--accent-2)}
  .ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .sn{font:600 12px var(--f-mono);letter-spacing:.28em;color:var(--text-dim);text-transform:uppercase;text-align:center}
  .big{margin-top:2px;font:700 calc(var(--rs)*.44)/1 var(--f-head);color:var(--accent-ink);font-variant-numeric:tabular-nums}
  .big.urgent{color:var(--accent-2)}
  .rn{margin-top:18px;text-align:center;max-width:100%}
  .rn .t{font:700 28px/1.1 var(--f-head);letter-spacing:.1em;text-transform:uppercase;overflow-wrap:anywhere}
  .rn .s{margin:8px auto 0;max-width:300px;color:var(--text-dim);font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .rbot{position:relative;padding:0 14px 14px}
  .nx{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
  .n2{flex:none;width:28px;height:28px;border-radius:8px;border:1px solid var(--ls);color:var(--text-dim);display:grid;place-items:center;font:700 13px var(--f-head)}
  .nx .tx{flex:1;min-width:0}
  .nt{margin-top:2px;font:600 16px var(--f-head);letter-spacing:.06em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lf{flex:none;font:500 12px var(--f-mono);color:var(--text-dim)}
  .rb{display:flex;gap:10px;margin-top:10px}
  .rb .p{flex:1;height:56px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;gap:10px;font:700 18px var(--f-head);letter-spacing:.1em;text-transform:uppercase}
  .rb .p svg{width:18px;height:18px;fill:currentColor;stroke:none}
  .rb .s{flex:none;width:56px;height:56px;border-radius:14px;background:var(--panel-2);border:1px solid var(--ls);color:var(--text-dim);display:grid;place-items:center;padding:0}
  .rb .s svg{width:20px;height:20px;fill:currentColor;stroke:none}
  .rb .s[hidden]{display:none}
  @media (max-height:520px){.rn{margin-top:10px}.rn .t{font-size:22px}.rn .s{font-size:13px;-webkit-line-clamp:2}.nx{padding:8px 12px}.rb .p,.rb .s{height:48px}.rb .s{width:48px}}
  @media (max-width:340px){.tgt button{font-size:10px}.badge{padding:0 7px}}
</style>
</head>
<body>
<main class="app">
  <section class="card rh" id="head">
    <div class="r1">
      <input id="rname" type="text" maxlength="60" placeholder="Routine name" aria-label="Routine name" autocomplete="off">
      <button id="pickBtn" class="ib" type="button" aria-haspopup="dialog" aria-label="Choose routine"><span id="pickN">1</span><svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>
    <div class="tl" id="tl"></div>
    <div class="tmeta"><div class="tm" id="tm"></div><div class="badge" id="badge"></div></div>
    <div class="tgt" id="tchips"></div>
  </section>

  <div class="sechd"><span class="lab">Sections · tap to edit</span></div>
  <div id="list"></div>
  <button id="add" class="add" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add section</button>
  <div id="quick">
    <button class="chip" type="button" data-name="Intro">+ Intro</button>
    <button class="chip" type="button" data-name="Build">+ Build</button>
    <button class="chip" type="button" data-name="Drop">+ Drop</button>
    <button class="chip" type="button" data-name="Tricks">+ Tricks</button>
    <button class="chip" type="button" data-name="Outro">+ Outro</button>
  </div>
</main>

<div class="dock"><div class="dock-in">
  <button id="rehearse" type="button"><svg viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>Rehearse</button>
  <button id="copy" type="button" aria-label="Copy as text" title="Copy as text"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
</div></div>
<p id="msg" class="msg" role="status" aria-live="polite"></p>

<div id="scrim" class="scrim" hidden></div>
<section id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-label="Your routines">
  <div class="grab"></div>
  <h2>Your <i>routines</i></h2>
  <div id="rlist"></div>
  <div class="two">
    <button id="newR" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New routine</button>
    <button id="tplBtn" type="button" aria-expanded="false"><svg class="i" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>From template</button>
  </div>
  <div id="tplRow" hidden>
    <button class="chip" type="button" data-tpl="wildcard">60s wildcard</button>
    <button class="chip" type="button" data-tpl="round">120s round</button>
  </div>
  <div class="two">
    <button id="dupR" type="button"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>Duplicate</button>
    <button id="delR" class="d" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>Delete</button>
  </div>
</section>

<section id="reh" class="reh" hidden aria-label="Rehearsal">
  <div class="glow"></div>
  <div class="rtop">
    <span id="rehName" class="nmr"></span>
    <button id="rehStop" class="stop" type="button"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>Stop</button>
  </div>
  <div class="prog" id="rehSegs" aria-hidden="true"></div>
  <div class="rmid">
    <div class="ringw" id="rehRing">
      <svg viewBox="0 0 250 250" aria-hidden="true"><circle class="trk" cx="125" cy="125" r="112"/><circle id="rehArc" cx="125" cy="125" r="112" stroke-dasharray="0 704"/></svg>
      <div class="ringc"><div id="rehSn" class="sn"></div><div id="rehTime" class="big">3</div></div>
    </div>
    <div class="rn"><div id="rehLabel" class="t" aria-live="polite">Get ready</div><div id="rehNotes" class="s"></div></div>
  </div>
  <div class="rbot">
    <div class="nx"><div id="rehNn" class="n2">1</div><div class="tx"><span class="lab">Next</span><div id="rehNext" class="nt"></div></div><div id="rehLeft" class="lf"></div></div>
    <div class="rb">
      <button id="rehPause" class="p" type="button"><svg id="rehIco" viewBox="0 0 24 24"></svg><span id="rehPauseTxt">Pause</span></button>
      <button id="rehSkip" class="s" type="button" aria-label="Skip to next section"><svg viewBox="0 0 24 24"><path d="M5 5l9 7-9 7zM17 4.5h2.5v15H17z"/></svg></button>
    </div>
  </div>
</section>

<script src="confirm.js?v=20261109j"></script>
<script>
(function () {
  'use strict';
  var KEY = 'savior-routines-v1';
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var uid = function () { return Math.random().toString(36).slice(2, 9); };
  var clamp = function (n, a, b) { return Math.min(b, Math.max(a, n)); };
  var CIRC = 703.7;

  function fmt(s) {
    s = Math.max(0, Math.round(s));
    var m = Math.floor(s / 60), r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  function totalOf(r) { return r.sections.reduce(function (a, s) { return a + s.sec; }, 0); }

  function mk(name, target, secs) {
    return {
      id: uid(), name: name, target: target,
      sections: secs.map(function (s) { return { id: uid(), name: s[0], sec: s[1], notes: s[2] || '' }; })
    };
  }
  var TPL = {
    blank: function () { return mk('New routine', 60, []); },
    wildcard: function () {
      return mk('60s wildcard', 60, [

         nn: nx ? i + 2 : '✓',
         next: nx ? nx.name + ' · ' + (nx.end - nx.start) + 's' : 'Last section',
         left: fmt(Math.ceil(run.total - p)) + ' left',
         arc: frac, seg: i, frac: frac, urgent: rem <= 3 });
  }
  function startRehearse() {
    var r = cur();
    if (!r.sections.length) { say('Add a section first'); return; }
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
    var segs = [], t = 0;
    r.sections.forEach(function (s, i) {
      segs.push({ name: s.name || 'Section ' + (i + 1), notes: s.notes, start: t, end: t + s.sec });
      t += s.sec;
    });
    cfg = opts();
    run = { segs: segs, total: t, pos: -cfg.countIn, last: performance.now(), paused: false, done: false, seg: -1, rem: null, whole: null };
    var bars = $('#rehSegs'); bars.textContent = '';
    segs.forEach(function (sg) {
      var d = document.createElement('div'); d.style.flexGrow = sg.end - sg.start;
      d.appendChild(document.createElement('i')); bars.appendChild(d);
    });
    $('#rehName').textContent = r.name || 'Routine';
    pauseBtn('Pause'); $('#rehSkip').hidden = false;
    $('#reh').hidden = false;
    lock();
    run.timer = setInterval(tick, 100);
    tick();
  }
  function skip() {
    if (!run || run.done) return;
    var nx = run.segs[run.seg + 1];
    if (run.pos < 0) run.pos = 0;
    else if (nx) run.pos = nx.start;
    else run.pos = run.total;
    run.last = performance.now(); run.paused = false; pauseBtn('Pause');
    tick();
  }
  $('#rehearse').addEventListener('click', startRehearse);
  $('#rehStop').addEventListener('click', stopRun);
  $('#rehSkip').addEventListener('click', skip);
  $('#rehPause').addEventListener('click', function () {
    if (!run) return;
    if (run.done) { stopRun(); return; }
    run.paused = !run.paused;
    pauseBtn(run.paused ? 'Resume' : 'Pause');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (run) stopRun(); else if (sheetOpen) closeSheet();
  });
  /* the shell tells us when this tab is left, so the sheet never lingers (Back button) */
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin) return;
    if (e.data && e.data.type === 'hidden') closeSheet();
  });

  renderAll();
})();
</script>
</body>
</html>
