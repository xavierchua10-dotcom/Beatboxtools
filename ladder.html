<!DOCTYPE html>
<html lang="en">
<head>
<script src="theme.js?v=20261108n"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>BPM ladder</title>
<link rel="stylesheet" href="fonts.css?v=20261108n">
<link rel="stylesheet" href="theme.css?v=20261108n">
<link rel="stylesheet" href="tools.css?v=20261108n">
<link rel="stylesheet" href="themes.css?v=20261108n">
<style>
  .t-name{font:600 15px var(--f-head);letter-spacing:.08em;text-transform:uppercase;background:none;border:0;color:var(--text);padding:0;text-align:left}
  .badge{font:500 10px var(--f-mono);color:var(--success);border:1px solid var(--success-line);border-radius:6px;padding:2px 6px}
  .best{font:700 30px var(--f-mono)}
  .best small{font-size:12px;color:var(--text-dim);font-weight:500}
  .draft{display:flex;gap:8px;margin-top:12px;align-items:stretch}
  .draft .chip{flex:none;min-width:48px;justify-content:center}
  .draft input{width:76px;text-align:center;padding:6px;min-height:34px;font-size:15px}
  .draft .btn{flex:1;min-height:34px;padding:6px 10px;font-size:12px}
  .edit{display:grid;grid-template-columns:1fr 90px;gap:8px;margin-top:12px}
  .edit label{font:500 10px var(--f-mono);letter-spacing:.14em;color:var(--text-dim);text-transform:uppercase;display:block;margin-bottom:4px}
  .edit .full{grid-column:1/-1}
  .hist{margin-top:10px;display:flex;gap:4px;align-items:flex-end;height:26px}
  .hist i{flex:1;background:var(--accent-dim);border-radius:2px;min-height:3px}
  .hist i:last-child{background:var(--accent)}
  .add{border-style:dashed;color:var(--accent-ink)}
</style>
</head>
<body>
<div class="app">
  <p class="mono dim" style="font-size:12px;margin:0 0 12px">Clean means no mistakes for 8 bars.</p>
  <div id="list"></div>
  <button class="btn block add" id="add" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/></svg> Add a technique</button>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
</div>
<script src="tools.js?v=20261108n"></script>
<script src="confirm.js?v=20261108n"></script>
<script>
(function () {
  var $ = Tools.$, KEY = 'savior-ladder-v1';
  var DEF = [
    { id: 'kick', name: 'Kick roll', best: 0, goal: 160, hist: [] },
    { id: 'snare', name: 'Inward snare', best: 0, goal: 140, hist: [] },
    { id: 'hat', name: 'Hi-hat pattern', best: 0, goal: 180, hist: [] }
  ];
  var items = Tools.store.get(KEY, null);
  if (!Array.isArray(items) || !items.length) items = JSON.parse(JSON.stringify(DEF));
  var drafts = {}, editing = null;
  function save() { Tools.store.set(KEY, items); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function draftOf(t) { return drafts[t.id] != null ? drafts[t.id] : (t.best ? t.best : 80); }
  function gain(t) {
    /* change against the best from 7 or more days ago */
    if (!t.hist.length || !t.best) return 0;
    var cut = Date.now() - 7 * 86400000, base = 0;
    t.hist.forEach(function (h) { if (h.t <= cut) base = h.v; });
    if (!base) base = t.hist[0].v;
    return t.best - base;
  }
  function card(t) {
    var pct = t.goal ? Math.min(100, t.best / t.goal * 100) : 0, g = gain(t);
    var h = t.hist.slice(-12), hm = 1;
    h.forEach(function (x) { hm = Math.max(hm, x.v); });
    var out = '<div class="card" data-id="' + t.id + '">' +
      '<div class="row sp" style="margin-bottom:8px"><button class="t-name" data-act="edit" aria-label="Edit ' + esc(t.name) + '">' + esc(t.name) + '</button>' +
      (g > 0 ? '<span class="badge">+' + g + '</span>' : '') + '</div>' +
      '<div class="row sp" style="align-items:flex-end;margin-bottom:8px"><div class="best">' + (t.best || '–') + '<small> BPM best</small></div><span class="mono dim" style="font-size:12px">goal ' + t.goal + '</span></div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>';
    if (h.length > 1) out += '<div class="hist" aria-hidden="true">' + h.map(function (x) { return '<i style="height:' + Math.max(12, x.v / hm * 100) + '%"></i>'; }).join('') + '</div>';
    if (editing === t.id) {
      out += '<div class="edit"><div><label for="n' + t.id + '">Name</label><input type="text" id="n' + t.id + '" data-f="name" maxlength="30" value="' + esc(t.name) + '"></div>' +
        '<div><label for="g' + t.id + '">Goal</label><input type="number" id="g' + t.id + '" data-f="goal" inputmode="numeric" min="20" max="400" value="' + t.goal + '"></div>' +
        '<div class="full btns" style="margin:0"><button class="btn danger" data-act="del" type="button">Delete</button><button class="btn" data-act="done" type="button">Done</button></div></div>';
    } else {
      out += '<div class="draft"><button class="chip" data-act="d1" type="button">+1</button><button class="chip" data-act="d5" type="button">+5</button>' +
        '<input type="number" inputmode="numeric" min="20" max="400" data-f="draft" aria-label="BPM to log" value="' + draftOf(t) + '"><button class="btn" data-act="log" type="button">Log new best</button></div>';
    }
    return out + '</div>';
  }
  function paint() { $('#list').innerHTML = items.map(card).join(''); }
  function find(el) { var c = el.closest('[data-id]'); if (!c) return null; var id = c.getAttribute('data-id'); for (var i = 0; i < items.length; i++) if (items[i].id === id) return items[i]; return null; }
  function say(t) { $('#msg').textContent = t; }

  $('#list').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var t = find(b); if (!t) return;
    var act = b.getAttribute('data-act');
    if (act === 'd1' || act === 'd5') {
      var cur = parseInt($('[data-id="' + t.id + '"] [data-f=draft]').value, 10) || draftOf(t);
      drafts[t.id] = Tools.clamp(cur + (act === 'd1' ? 1 : 5), 20, 400);
      $('[data-id="' + t.id + '"] [data-f=draft]').value = drafts[t.id];
    } else if (act === 'log') {
      var v = Tools.clamp(parseInt($('[data-id="' + t.id + '"] [data-f=draft]').value, 10) || 0, 20, 400);
      if (!v) return;
      if (t.best && v <= t.best) { say('Log a BPM above your best of ' + t.best + ', or edit the technique.'); return; }
      t.best = v; t.hist.push({ t: Date.now(), v: v }); delete drafts[t.id]; save(); paint();
      say(t.name + ': new best, ' + v + ' BPM.');
    } else if (act === 'edit') { editing = t.id; paint(); }
    else if (act === 'done') { editing = null; save(); paint(); }
    else if (act === 'del') {
      Confirm.ask({ title: 'Delete this technique?', message: '\u201c' + t.name + '\u201d and its logged bests will be deleted for good.', confirmLabel: 'Delete' }).then(function (ok) {
        if (!ok) return;
        items = items.filter(function (x) { return x !== t; }); editing = null; save(); paint();
      });
    }
  });
  $('#list').addEventListener('input', function (e) {
    var f = e.target.getAttribute('data-f'), t = find(e.target); if (!t) return;
    if (f === 'name') { t.name = e.target.value.slice(0, 30) || 'Technique'; save(); }
    else if (f === 'goal') { var g = parseInt(e.target.value, 10); if (g >= 20) { t.goal = Math.min(400, g); save(); } }
    else if (f === 'draft') { var d = parseInt(e.target.value, 10); if (d) drafts[t.id] = d; }
  });
  $('#add').addEventListener('click', function () {
    var t = { id: 't' + Date.now().toString(36), name: 'New technique', best: 0, goal: 120, hist: [] };
    items.push(t); editing = t.id; save(); paint();
    var n = $('#n' + t.id); if (n) { n.focus(); n.select(); }
  });
  paint();
})();
</script>
</body>
</html>
