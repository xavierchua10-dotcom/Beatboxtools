<!DOCTYPE html>
<html lang="en">
<head>
<script src="theme.js?v=20261108r"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>Practice log</title>
<link rel="stylesheet" href="fonts.css?v=20261108r">
<link rel="stylesheet" href="theme.css?v=20261108r">
<link rel="stylesheet" href="tools.css?v=20261108r">
<link rel="stylesheet" href="themes.css?v=20261108r">
<style>
  .goal{cursor:pointer;background:none;border:0;color:var(--text-dim);font:500 10px var(--f-mono);padding:6px 0 0}
  .week{display:flex;align-items:flex-end;gap:8px;height:116px}
  .week .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
  .week .col{flex:1;width:100%;display:flex;align-items:flex-end}
  .week .col i{display:block;width:100%;border-radius:5px;background:var(--accent-dim);min-height:3px}
  .week .d.today .col i{background:var(--accent)}
  .week .d.zero .col i{background:var(--panel-3)}
  .week .d span{font:500 10px var(--f-mono);color:var(--text-faint)}
  .week .d.today span{color:var(--accent-ink)}
  .week .d.future{opacity:.4}
  .split{margin-bottom:11px}
  .split:last-child{margin-bottom:0}
  .split .n{font:600 13px var(--f-head);letter-spacing:.06em;text-transform:uppercase}
  .split .bar{height:8px;margin-top:5px}
  .flame{width:22px;height:22px;fill:var(--accent)}
  .empty{color:var(--text-dim);font-size:13px;text-align:center;padding:6px 0}
</style>
</head>
<body>
<div class="app">
  <div class="stats">
    <div class="card stat" style="flex:1.2">
      <div class="big" id="today" style="color:var(--accent-ink)">0</div>
      <div class="cap" style="margin-top:6px">min today</div>
      <div class="bar" style="margin-top:10px;height:7px"><i id="goalBar"></i></div>
      <button class="goal" id="goal" type="button" aria-label="Change the daily goal">goal 30 min</button>
    </div>
    <div class="card stat">
      <div class="row" style="justify-content:center;gap:4px"><svg class="flame" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2s5 4 5 9a5 5 0 0 1-10 0c0-2 1-3 1-3s1 2 2 2c0-3 0-6 2-8z"/></svg><span class="big" id="streak" style="font-size:44px">0</span></div>
      <div class="cap" style="margin-top:8px">day streak</div>
      <div class="cap" id="best" style="margin-top:8px;text-transform:none">best 0</div>
    </div>
  </div>
  <div class="card">
    <div class="row sp" style="margin-bottom:12px"><span class="lab" style="margin:0">This week</span><span class="mono dim" id="weekTotal" style="font-size:12px">0 min</span></div>
    <div class="week" id="week"></div>
  </div>
  <div class="card">
    <span class="lab">Where it went today</span>
    <div id="split"></div>
  </div>
  <p class="note" style="margin-top:2px">Counts the time a tool is open and active. Stays on this phone. A day counts toward the streak from one minute.</p>
</div>
<script src="plog.js?v=20261108r"></script>
<script src="tools.js?v=20261108r"></script>
<script>
(function () {
  var $ = Tools.$, GOALS = [15, 30, 45, 60, 90];
  function mins(s) { return Math.round(s / 60); }
  function paint() {
    var o = PLog.load(), day = o.days[PLog.key()] || {}, tot = PLog.total(day), goal = o.goal || 30;
    $('#today').textContent = mins(tot);
    $('#goal').textContent = 'goal ' + goal + ' min';
    $('#goalBar').style.width = Math.min(100, tot / 60 / goal * 100) + '%';
    var st = PLog.streak(o);
    $('#streak').textContent = st.now;
    $('#best').textContent = 'best ' + st.best;
    var wk = PLog.week(o), mx = 600, sum = 0;
    wk.forEach(function (d) { mx = Math.max(mx, d.sec); sum += d.sec; });
    $('#weekTotal').textContent = mins(sum) + ' min';
    $('#week').innerHTML = wk.map(function (d) {
      return '<div class="d' + (d.today ? ' today' : '') + (d.sec < 1 ? ' zero' : '') + (d.future ? ' future' : '') + '" title="' + mins(d.sec) + ' min"><div class="col"><i style="height:' + (d.sec > 0 ? Math.max(4, d.sec / mx * 100) : 3) + '%"></i></div><span>' + d.label + '</span></div>';
    }).join('');
    var keys = Object.keys(day).filter(function (k) { return day[k] >= 1; }).sort(function (a, b) { return day[b] - day[a]; });
    var top = keys.length ? day[keys[0]] : 1;
    $('#split').innerHTML = keys.length ? keys.map(function (k) {
      var m = Math.floor(day[k] / 60), label = m >= 1 ? m + ' min' : '<1 min';
      return '<div class="split"><div class="row sp"><span class="n">' + (PLog.NAMES[k] || k) + '</span><span class="mono dim" style="font-size:12px">' + label + '</span></div><div class="bar"><i style="width:' + Math.max(4, day[k] / top * 100) + '%"></i></div></div>';
    }).join('') : '<div class="empty">Nothing yet today. Open a tool and it starts counting.</div>';
  }
  $('#goal').addEventListener('click', function () {
    var o = PLog.load(), i = GOALS.indexOf(o.goal || 30);
    o.goal = GOALS[(i + 1) % GOALS.length]; PLog.save(o); paint();
  });
  Tools.onShown(paint);
  setInterval(function () { if (document.visibilityState === 'visible') paint(); }, 5000);
  paint();
})();
</script>
</body>
</html>
