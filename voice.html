<!DOCTYPE html>
<html lang="en">
<head>
<script src="theme.js?v=20261109h"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice note by Savior</title>
<link rel="stylesheet" href="fonts.css?v=20261109h">
<link rel="stylesheet" href="theme.css?v=20261109h">
<link rel="stylesheet" href="themes.css?v=20261109h">
<style>
  body{position:relative;overflow-x:hidden}
  .bg{position:fixed;inset:0;pointer-events:none;z-index:0}
  .bg .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(var(--accent-rgb),.045) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--accent-rgb),.045) 1px,transparent 1px);background-size:30px 30px;-webkit-mask-image:linear-gradient(#000 10%,transparent 70%);mask-image:linear-gradient(#000 10%,transparent 70%)}
  .bg .glow{position:absolute;left:50%;top:-160px;width:520px;height:520px;transform:translateX(-50%);background:radial-gradient(circle,rgba(var(--accent-rgb),.2),transparent 62%)}
  .bg .sky{position:absolute;left:0;right:0;bottom:0;height:260px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 6px;gap:6px}
  .bg .sky i{flex:1;max-width:12px;border-radius:3px 3px 0 0;background:rgba(var(--accent-rgb),.07)}
  .app{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;min-height:100vh;min-height:100dvh}
  .center{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:18px}
  .dock{width:100%;display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
  body.recording .dock{visibility:hidden}
  .dk{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px 14px}
  .dk[hidden]{display:none}
  button.dk{cursor:pointer}
  .dk:active{background:var(--panel-2)}
  .dk .lab{font:500 10px var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--text-faint)}
  .dk .big{font:700 17px var(--f-head);letter-spacing:.06em;text-transform:uppercase;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dk .sm{font-size:12px;color:var(--text-dim);margin-top:2px}
  .dk .grow{flex:1;min-width:0}
  .dk .rt{text-align:right;flex:none}
  .dk .rt .big{color:var(--accent-ink);font-size:21px}
  .ring{flex:none}
  .ring text{font:700 14px var(--f-head);fill:var(--text)}
  .lp{flex:none;width:40px;height:40px;border-radius:50%;border:0;padding:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;cursor:pointer}
  .lp svg{width:16px;height:16px;fill:currentColor}
  .lp .i-pause{display:none}
  .lp.playing .i-play{display:none}
  .lp.playing .i-pause{display:block}
  .lt{font:500 12px var(--f-mono);color:var(--text-dim);flex:none}
  .status{min-height:22px;margin:0 0 6px;text-align:center;color:var(--text-dim);font-size:14px}
  .status.err{color:var(--accent-2)}
  .time{font:500 52px/1 var(--f-mono);letter-spacing:.02em;margin:4px 0 18px;color:var(--text)}
  .time.live{color:var(--accent-ink)}
  .wave{display:flex;align-items:center;justify-content:center;gap:3px;height:64px;width:100%;margin-bottom:26px}
  .wave i{display:block;width:5px;height:4px;border-radius:3px;background:var(--line-strong);transition:height 80ms linear}
  .wave.live i{background:linear-gradient(180deg,var(--accent),var(--accent-deep))}
  .mic{
    position:relative;width:128px;height:128px;border-radius:50%;border:0;padding:0;color:var(--on-accent);
    display:grid;place-items:center;background:var(--accent);
    box-shadow:0 0 0 6px rgba(var(--accent-rgb),.12),0 10px 40px rgba(var(--accent-rgb),.3);
    transition:transform 120ms ease,background 200ms ease,box-shadow 200ms ease;
  }
  .mic::before{content:"";position:absolute;inset:-24px;border-radius:50%;border:1px solid rgba(var(--accent-rgb),.16);pointer-events:none}
  .mic:active{transform:scale(.96)}
  .mic.rec{background:var(--accent-2);color:#fff;box-shadow:0 0 0 6px rgba(193,68,60,.18),0 10px 36px rgba(193,68,60,.35)}
  .mic.rec::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--accent-2);animation:pulse 1.4s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.25);opacity:0}}
  @media (prefers-reduced-motion:reduce){.mic.rec::after{animation:none;opacity:.6}}
  .ic{width:52px;height:52px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .mic .ic-stop{display:none}
  .mic.rec .ic-mic{display:none}
  .mic.rec .ic-stop{display:block}
  #cancel{margin-top:36px}
  .mic{margin:14px 0}
  .sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
  .sheet[hidden]{display:none}
  .scrim{position:absolute;inset:0;background:rgba(10,11,13,.72);animation:fade .2s ease both}
  .panel{
    position:relative;width:100%;max-width:480px;background:var(--panel);border:1px solid var(--line);border-bottom:0;
    border-radius:20px 20px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:rise .26s cubic-bezier(.2,.8,.2,1) both;
  }
  .grab{width:40px;height:4px;border-radius:2px;background:var(--panel-3);margin:0 auto 14px}
  .panel h2{margin:0 0 4px;font:700 20px var(--f-head);letter-spacing:.08em;text-transform:uppercase;text-align:center}
  .panel h2 span{color:var(--accent-ink)}
  .panel .sub{margin:0 0 14px;text-align:center;color:var(--text-dim);font:400 12px var(--f-mono)}
  .panel input{font:600 17px var(--f-body);margin:0 0 14px}
  .panel .row{display:flex;gap:10px}
  .panel .row .btn{flex:1}
  .panel .row .btn.danger{flex:0 0 auto}
  .panel .row .btn.primary{flex:1}
  .panel .row .btn[hidden]{display:none}
  @keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="grid"></div><div class="glow"></div><div class="sky" id="sky"></div></div>
<main class="app">
  <h1 class="page-title">Voice <span>note</span></h1>

  <div class="center">
    <p id="status" class="status" role="status" aria-live="polite">Tap the mic to record</p>
    <div id="time" class="time">0:00.0</div>
    <div id="wave" class="wave" aria-hidden="true"></div>

    <button id="mic" class="mic" type="button" aria-label="Start recording">
      <svg class="ic ic-mic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <svg class="ic ic-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2.5" fill="currentColor" stroke="none"/></svg>
    </button>
    <button id="cancel" class="btn" type="button" hidden>Cancel and discard</button>
  </div>
  <section class="dock" aria-label="Today">
    <button class="dk" id="today" type="button" aria-label="Open practice log">
      <svg class="ring" width="62" height="62" viewBox="0 0 62 62" aria-hidden="true"><circle cx="31" cy="31" r="25" fill="none" stroke="var(--line-strong)" stroke-width="6"/><circle id="ringArc" cx="31" cy="31" r="25" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="0 157" transform="rotate(-90 31 31)"/><text id="ringTxt" x="31" y="36" text-anchor="middle">0</text></svg>
      <div class="grow"><div class="lab">Today</div><div class="big" id="tBig">0 / 30 min</div><div class="sm" id="tSm"></div></div>
      <div class="rt"><div class="lab">Streak</div><div class="big" id="tStreak">0 days</div></div>
    </button>
    <div class="dk" id="last" hidden>
      <button class="lp" id="lastPlay" type="button" aria-label="Play last note"><svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.5" height="14" rx="1.2"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.2"/></svg></button>
      <div class="grow"><div class="lab">Last note</div><div class="big" id="lastName"></div></div>
      <div class="lt" id="lastLen"></div>
    </div>
  </section>
</main>

<div id="sheet" class="sheet" hidden>
  <div class="scrim" id="shScrim"></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="shTitle">
    <div class="grab"></div>
    <h2 id="shTitle">Name your <span>note</span></h2>
    <p class="sub" id="shSub"></p>
    <input id="shName" type="text" maxlength="60" autocomplete="off" enterkeyhint="done" spellcheck="false" aria-label="Note name">
    <div class="row">
      <button id="shDiscard" class="btn danger" type="button">Discard</button>
      <button id="shSave" class="btn primary" type="button">Save</button>
      <button id="shDl" class="btn primary" type="button" hidden>Download</button>
    </div>
  </div>
</div>

<script src="confirm.js?v=20261109h"></script>
<script src="plog.js?v=20261109h"></script>
<script>
(function () {
  'use strict';
  var DB = 'savior-voice-notes';
  var RAW_KEY = 'savior-voice-raw';
  var N = 48;
  var $ = function (s) { return document.querySelector(s); };
  var uid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };
  var inFrame = window.parent !== window;

  var bc = null;
  try { bc = new BroadcastChannel('savior-voice'); } catch (e) {}
  function tell(m) {
    if (m && m.type === 'saved') setTimeout(function () { if (window.__lastRefresh) window.__lastRefresh(); }, 120);
    try { if (bc) bc.postMessage(m); } catch (e) {}
    try { if (inFrame) window.parent.postMessage(m, location.origin); } catch (e) {}
  }

  function fmtLive(s) {
    var m = Math.floor(s / 60), r = s - m * 60;
    return m + ':' + (r < 10 ? '0' : '') + r.toFixed(1);
  }
  function fmt(s) {
    s = Math.max(0, Math.round(s));
    return Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60);
  }

  /* raw audio is a switch in Settings; on by default */
  function rawOn() { try { return localStorage.getItem(RAW_KEY) !== '0'; } catch (e) { return true; } }

  var waveEl = $('#wave'), bars = [];
  for (var i = 0; i < N; i++) { var b = document.createElement('i'); waveEl.appendChild(b); bars.push(b); }
  function paintWave(levels) {
    var off = levels.length - N;
    for (var i = 0; i < N; i++) {
      var v = off + i >= 0 ? levels[off + i] : 0;
      bars[i].style.height = (4 + Math.round(v * 56)) + 'px';
    }
  }
  paintWave([]);

  function status(t, isErr) {
    var el = $('#status');
    el.textContent = t;
    el.classList.toggle('err', !!isErr);
  }

  function openDB() {
    return new Promise(function (res, rej) {
      if (!window.indexedDB) { rej(new Error('no indexedDB')); return; }
      var q = indexedDB.open(DB, 1);
      q.onupgradeneeded = function () {
        var d = q.result;
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('blob')) d.createObjectStore('blob', { keyPath: 'id' });
      };
      q.onsuccess = function () { res(q.result); };
      q.onerror = function () { rej(q.error); };
    });
  }
  function put(meta, blob) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(['meta', 'blob'], 'readwrite');
        tx.objectStore('meta').put(meta);
        tx.objectStore('blob').put({ id: meta.id, blob: blob });
        tx.oncomplete = function () { db.close(); res(); };
        tx.onerror = tx.onabort = function () { db.close(); rej(tx.error || new Error('save failed')); };
      });
    });
  }

  function pickMime() {
    var c = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
    for (var i = 0; i < c.length; i++) {
      try { if (window.MediaRecorder && MediaRecorder.isTypeSupported(c[i])) return c[i]; } catch (e) {}
    }
    return '';
  }
  function extOf(mime) {
    return mime.indexOf('mp4') > -1 ? 'm4a' : mime.indexOf('ogg') > -1 ? 'ogg' : 'webm';
  }
  function downsample(a, n) {
    var out = [], max = 0, i, j;
    if (!a.length) { for (i = 0; i < n; i++) out.push(0.06); return out; }
    for (i = 0; i < n; i++) {
      var s = Math.floor(i * a.length / n), e = Math.max(s + 1, Math.floor((i + 1) * a.length / n)), m = 0;
      for (j = s; j < e && j < a.length; j++) if (a[j] > m) m = a[j];
      out.push(m); if (m > max) max = m;
    }
    var k = max > 0.01 ? 1 / max : 1;
    return out.map(function (v) { return Math.round(Math.max(0.06, Math.min(1, v * k)) * 100) / 100; });
  }
  function defaultName() {
    var d = new Date();
    return 'Voice note ' + d.toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  var st = { rec: null, stream: null, ac: null, an: null, buf: null, chunks: [], t0: 0, levels: [], peaks: [],
             timer: null, sampler: null, discard: false, mime: '', wl: null, busy: false };

  function lock() {
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (l) { st.wl = l; }, function () {}); } catch (e) {}
  }
  function unlock() { try { if (st.wl) { st.wl.release(); st.wl = null; } } catch (e) {} }

  function setRecUI(on) {
    $('#mic').classList.toggle('rec', on);
    $('#mic').setAttribute('aria-label', on ? 'Stop and save recording' : 'Start recording');
    $('#cancel').hidden = !on;
    $('#time').classList.toggle('live', on);
    waveEl.classList.toggle('live', on);
    document.body.classList.toggle('recording', on);
  }

  function start() {
    if (st.rec || st.busy) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      status('This browser cannot record audio.', true); return;
    }
    try {
      st.ac = new (window.AudioContext || window.webkitAudioContext)();
      if (st.ac.state === 'suspended') st.ac.resume();
    } catch (e) { st.ac = null; }
    var raw = rawOn();
    status('Asking for the microphone');
    navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: !raw, noiseSuppression: !raw, autoGainControl: !raw }
    }).then(begin, function (err) {
      cleanup();
      status(err && err.name === 'NotAllowedError'
        ? 'Microphone blocked. Allow it in your browser settings, then try again.'
        : 'No microphone found.', true);
    });
  }

  function begin(stream) {
    st.stream = stream; st.chunks = []; st.levels = []; st.peaks = []; st.discard = false;
    var mime = pickMime(), rec;
    try { rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream); }
    catch (e) { rec = new MediaRecorder(stream); }
    st.rec = rec; st.mime = rec.mimeType || mime || 'audio/webm';
    rec.ondataavailable = function (e) { if (e.data && e.data.size) st.chunks.push(e.data); };
    rec.onstop = finish;
    rec.onerror = function () { status('Recording failed.', true); };
    st.an = null;
    try {
      var src = st.ac.createMediaStreamSource(stream);
      st.an = st.ac.createAnalyser(); st.an.fftSize = 1024;
      st.buf = new Uint8Array(st.an.fftSize);
      src.connect(st.an);
    } catch (e) { st.an = null; }
    rec.start(1000);
    st.t0 = performance.now();
    setRecUI(true);
    status('Recording');
    lock();
    st.timer = setInterval(function () { $('#time').textContent = fmtLive((performance.now() - st.t0) / 1000); }, 100);
    st.sampler = setInterval(function () {
      var lvl = 0.03;
      if (st.an) {
        st.an.getByteTimeDomainData(st.buf);
        var sum = 0;
        for (var i = 0; i < st.buf.length; i++) { var v = (st.buf[i] - 128) / 128; sum += v * v; }
        var rms = Math.sqrt(sum / st.buf.length);
        st.peaks.push(rms);
        lvl = Math.min(1, rms * 4);
      } else { st.peaks.push(0); }
      st.levels.push(lvl);
      if (st.levels.length > N) st.levels.shift();
      paintWave(st.levels);
    }, 80);
    tell({ type: 'recording', on: true });
  }

  function cleanup() {
    clearInterval(st.timer); clearInterval(st.sampler);
    if (st.stream) st.stream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) {} });
    if (st.ac) { try { st.ac.close(); } catch (e) {} }
    unlock();
    st.stream = null; st.ac = null; st.an = null; st.rec = null;
    setRecUI(false);
    paintWave([]);
    tell({ type: 'recording', on: false });
  }

  function finish() {
    var dur = (performance.now() - st.t0) / 1000;
    var chunks = st.chunks, mime = st.mime, peaks = st.peaks, discard = st.discard;
    cleanup();
    $('#time').textContent = '0:00.0';
    if (discard) { status('Discarded'); return; }
    if (dur < 0.6 || !chunks.length) { status('Too short, so it was not saved.'); return; }
    var blob = new Blob(chunks, { type: mime });
    var meta = {
      id: uid(), name: defaultName(), created: Date.now(), duration: Math.round(dur * 10) / 10,
      mime: blob.type, size: blob.size, peaks: downsample(peaks, N)
    };
    st.busy = true;
    status('Saving');
    /* stored straight away under a default name, so nothing is lost if the app closes; the sheet then names or discards it */
    put(meta, blob).then(function () {
      st.busy = false;
      status('Name your note');
      openSheet(meta, null);
      tell({ type: 'saved' });
    }, function () {
      st.busy = false;
      status('Could not save on this browser. Download it instead.', true);
      openSheet(meta, blob);
    });
  }

  function del(id) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(['meta', 'blob'], 'readwrite');
        tx.objectStore('meta').delete(id); tx.objectStore('blob').delete(id);
        tx.oncomplete = function () { db.close(); res(); };
        tx.onerror = tx.onabort = function () { db.close(); rej(tx.error); };
      });
    });
  }
  function putMeta(m) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction('meta', 'readwrite');
        tx.objectStore('meta').put(m);
        tx.oncomplete = function () { db.close(); res(); };
        tx.onerror = tx.onabort = function () { db.close(); rej(tx.error); };
      });
    });
  }

  var lastBlob = null, lastMeta = null, sheetOpen = false;
  function openSheet(meta, failedBlob) {
    lastBlob = failedBlob; lastMeta = meta;
    $('#shName').value = meta.name;
    $('#shSub').textContent = fmt(meta.duration) + ' · ' + Math.max(1, Math.round(meta.size / 1024)) + ' KB';
    $('#shSave').hidden = !!failedBlob;
    $('#shDl').hidden = !failedBlob;
    $('#sheet').hidden = false; sheetOpen = true;
    setTimeout(function () { var i = $('#shName'); try { i.focus(); i.select(); } catch (e) {} }, 60);
  }
  function closeSheet() { $('#sheet').hidden = true; sheetOpen = false; }
  function chosenName() {
    var v = $('#shName').value.trim().slice(0, 60);
    return v || lastMeta.name;
  }
  function saveName() {
    if (!sheetOpen || !lastMeta) return;
    var m = lastMeta, v = chosenName();
    closeSheet();
    if (v === m.name) { status('Saved to history'); return; }
    m.name = v;
    putMeta(m).then(function () { status('Saved to history'); tell({ type: 'saved' }); },
                    function () { status('Saved, but the name could not be changed.', true); });
  }
  function discardNote() {
    if (!sheetOpen || !lastMeta) return;
    var m = lastMeta, unsaved = !!lastBlob;
    closeSheet();
    if (unsaved) { status('Discarded'); return; }
    del(m.id).then(function () { status('Discarded'); tell({ type: 'saved' }); },
                   function () { status('Could not discard that note.', true); });
  }
  $('#shSave').addEventListener('click', saveName);
  $('#shScrim').addEventListener('click', function () { if (!lastBlob) saveName(); });
  $('#shDiscard').addEventListener('click', function () {
    Confirm.ask({ title: 'Delete this recording?', message: 'It will be deleted for good.', confirmLabel: 'Delete' }).then(function (ok) { if (ok) discardNote(); });
  });
  $('#shName').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); if (lastBlob) $('#shDl').click(); else saveName(); } });
  $('#shDl').addEventListener('click', function () {
    if (!lastBlob) return;
    var nm = chosenName();
    var a = document.createElement('a'), url = URL.createObjectURL(lastBlob);
    a.href = url; a.download = (nm.replace(/[^a-z0-9 _.-]+/gi, '').trim().replace(/\s+/g, '-').slice(0, 60) || 'voice-note') + '.' + extOf(lastMeta.mime || '');
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    closeSheet(); status('Downloaded');
  });

  $('#mic').addEventListener('click', function () {
    if (st.rec) { if (st.rec.state !== 'inactive') st.rec.stop(); }
    else start();
  });
  /* the dock: today's practice, and the newest note */
  (function () {
    var sky = $('#sky'), hs = [40, 90, 60, 150, 100, 200, 120, 70, 160, 110, 210, 90, 170, 130, 60, 150, 100, 180, 80, 140, 110, 190, 70, 120];
    hs.forEach(function (h) { var i = document.createElement('i'); i.style.height = h + 'px'; sky.appendChild(i); });
    function paintToday() {
      var o = PLog.load(), t = Math.round(PLog.total(o.days[PLog.key()]) / 60), g = o.goal || 30, st = PLog.streak(o).now;
      $('#tBig').textContent = t + ' / ' + g + ' min';
      $('#tSm').textContent = t >= g ? 'Goal reached' : (g - t) + ' more to hit your goal';
      $('#tStreak').textContent = st + (st === 1 ? ' day' : ' days');
      $('#ringTxt').textContent = t;
      $('#ringArc').setAttribute('stroke-dasharray', (Math.min(1, t / g) * 157).toFixed(1) + ' 157');
    }
    var au = new Audio(), lastId = null, lastUrl = null, lastDur = 0;
    function lp(on) { $('#lastPlay').classList.toggle('playing', on); $('#lastPlay').setAttribute('aria-label', on ? 'Pause last note' : 'Play last note'); }
    au.addEventListener('ended', function () { lp(false); });
    au.addEventListener('pause', function () { lp(false); });
    au.addEventListener('play', function () { lp(true); });
    function refreshLast() {
      openDB().then(function (db) {
        return new Promise(function (res) {
          var q = db.transaction(['meta'], 'readonly').objectStore('meta').getAll();
          q.onsuccess = function () { db.close(); res(q.result || []); }; q.onerror = function () { db.close(); res([]); };
        });
      }).then(function (rows) {
        rows.sort(function (a, b) { return b.created - a.created; });
        var m = rows[0];
        $('#last').hidden = !m;
        if (!m) { lastId = null; return; }
        if (m.id !== lastId) { try { au.pause(); } catch (e) {} if (lastUrl) { URL.revokeObjectURL(lastUrl); lastUrl = null; } au.removeAttribute('src'); lastId = m.id; }
        $('#lastName').textContent = m.name; $('#lastLen').textContent = fmt(m.duration); lastDur = m.duration;
      }, function () { $('#last').hidden = true; });
    }
    window.__lastRefresh = refreshLast;
    $('#lastPlay').addEventListener('click', function () {
      if (!lastId) return;
      if (!au.paused) { au.pause(); return; }
      var go = function () { var p = au.play(); if (p && p.catch) p.catch(function () {}); };
      if (au.getAttribute('src')) { go(); return; }
      openDB().then(function (db) {
        var q = db.transaction(['blob'], 'readonly').objectStore('blob').get(lastId);
        q.onsuccess = function () { db.close(); if (q.result && q.result.blob) { lastUrl = URL.createObjectURL(q.result.blob); au.src = lastUrl; go(); } };
        q.onerror = function () { db.close(); };
      });
    });
    $('#today').addEventListener('click', function () { try { window.parent.postMessage({ type: 'open', pane: 'log' }, location.origin); } catch (e) {} });
    window.addEventListener('storage', function (e) { if (e.key === PLog.KEY) paintToday(); });
    if (bc) bc.addEventListener('message', function (e) { if (e.data && e.data.type === 'saved') refreshLast(); });
    window.addEventListener('message', function (e) {
      if (e.origin !== location.origin || !e.data) return;
      if (e.data.type === 'shown') { paintToday(); refreshLast(); }
      else if (e.data.type === 'hidden') { try { au.pause(); } catch (x) {} }
    });
    document.addEventListener('visibilitychange', function () { if (document.hidden) { try { au.pause(); } catch (x) {} } else { paintToday(); } });
    paintToday(); refreshLast();
  })();

  $('#cancel').addEventListener('click', function () {
    if (!st.rec || st.rec.state === 'inactive') return;
    Confirm.ask({ title: 'Discard this recording?', message: 'It will not be saved. Recording keeps going until you choose.', confirmLabel: 'Discard' }).then(function (ok) {
      if (ok && st.rec && st.rec.state !== 'inactive') { st.discard = true; st.rec.stop(); }
    });
  });
})();
</script>
</body>
