<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice note by Savior</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fonts.css?v=20261108b">
<link rel="stylesheet" href="theme.css?v=20261108b">
<style>
  .app{display:flex;flex-direction:column;align-items:center}
  .status{min-height:22px;margin:0 0 6px;text-align:center;color:var(--text-dim);font-size:14px}
  .status.err{color:var(--accent-2)}
  .time{font:500 52px/1 var(--f-mono);letter-spacing:.02em;margin:4px 0 18px;color:var(--text)}
  .time.live{color:var(--accent)}
  .wave{display:flex;align-items:center;justify-content:center;gap:3px;height:64px;width:100%;margin-bottom:26px}
  .wave i{display:block;width:5px;height:4px;border-radius:3px;background:#3a4049;transition:height 80ms linear}
  .wave.live i{background:linear-gradient(180deg,var(--accent),#b8841f)}
  .mic{
    position:relative;width:128px;height:128px;border-radius:50%;border:0;padding:0;color:var(--on-accent);
    display:grid;place-items:center;background:var(--accent);
    box-shadow:0 0 0 6px rgba(var(--accent-rgb),.12),0 10px 36px rgba(var(--accent-rgb),.22);
    transition:transform 120ms ease,background 200ms ease,box-shadow 200ms ease;
  }
  .mic:active{transform:scale(.96)}
  .mic.rec{background:var(--accent-2);color:#fff;box-shadow:0 0 0 6px rgba(193,68,60,.18),0 10px 36px rgba(193,68,60,.35)}
  .mic.rec::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--accent-2);animation:pulse 1.4s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.25);opacity:0}}
  @media (prefers-reduced-motion:reduce){.mic.rec::after{animation:none;opacity:.6}}
  .ic{width:52px;height:52px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .mic .ic-stop{display:none}
  .mic.rec .ic-mic{display:none}
  .mic.rec .ic-stop{display:block}
  #cancel{margin-top:22px}
  .toggle{display:flex;align-items:flex-start;gap:12px;width:100%;margin-top:30px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;cursor:pointer}
  .toggle input{appearance:none;-webkit-appearance:none;flex:none;width:44px;height:26px;border-radius:99px;margin:1px 0 0;
    background:var(--panel-3);border:1px solid var(--line);position:relative;cursor:pointer;transition:background 160ms ease,border-color 160ms ease}
  .toggle input::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--text-dim);transition:transform 160ms ease,background 160ms ease}
  .toggle input:checked{background:rgba(var(--accent-rgb),.22);border-color:var(--accent)}
  .toggle input:checked::after{transform:translateX(18px);background:var(--accent)}
  .toggle b{display:block;font:600 13px var(--f-head);letter-spacing:.06em;text-transform:uppercase}
  .toggle small{display:block;margin-top:3px;color:var(--text-dim);font-size:12px;line-height:1.45}
  .saved{width:100%;margin-top:18px;padding:14px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--success);border-radius:14px}
  .saved[hidden]{display:none}
  .saved p{margin:0 0 12px;font-size:14px;line-height:1.4}
  .saved .nm{font-weight:600;overflow-wrap:anywhere}
  .saved .sub{color:var(--text-dim);font:400 12px var(--f-mono);margin-top:2px}
  .saved .row{display:flex;gap:8px;flex-wrap:wrap}
  .saved .btn.primary{font-size:13px}
</style>
</head>
<body>
<main class="app">
  <h1 class="page-title">Voice <span>note</span></h1>
  <p class="page-tag">by savior</p>

  <p id="status" class="status" role="status" aria-live="polite">Tap the mic to record</p>
  <div id="time" class="time">0:00.0</div>
  <div id="wave" class="wave" aria-hidden="true"></div>

  <button id="mic" class="mic" type="button" aria-label="Start recording">
    <svg class="ic ic-mic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    <svg class="ic ic-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2.5" fill="currentColor" stroke="none"/></svg>
  </button>
  <button id="cancel" class="btn" type="button" hidden>Cancel and discard</button>

  <div id="saved" class="saved" hidden>
    <p><span class="nm" id="savedName"></span><span class="sub" id="savedSub" style="display:block"></span></p>
    <div class="row">
      <button id="openHist" class="btn primary" type="button">Open history</button>
      <button id="dlSaved" class="btn" type="button" hidden>Download</button>
    </div>
  </div>

  <label class="toggle">
    <input id="raw" type="checkbox" checked>
    <span><b>Raw audio</b><small>No echo cancelling, noise reduction or auto gain. Keeps your beatbox sounds as they are.</small></span>
  </label>
</main>

<script>
(function () {
  'use strict';
  var DB = 'savior-voice-notes';
  var RAW_KEY = 'savior-voice-raw';
  var N = 48;
  var $ = function (s) { return document.querySelector(s); };
  var uid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };
  var inFrame = window.parent !== window;

  var bc = null;
  try { bc = new BroadcastChannel('savior-voice'); } catch (e) {}
  function tell(m) {
    try { if (bc) bc.postMessage(m); } catch (e) {}
    try { if (inFrame) window.parent.postMessage(m, location.origin); } catch (e) {}
  }

  function fmtLive(s) {
    var m = Math.floor(s / 60), r = s - m * 60;
    return m + ':' + (r < 10 ? '0' : '') + r.toFixed(1);
  }
  function fmt(s) {
    s = Math.max(0, Math.round(s));
    return Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60);
  }

  try { if (localStorage.getItem(RAW_KEY) === '0') $('#raw').checked = false; } catch (e) {}
  $('#raw').addEventListener('change', function () {
    try { localStorage.setItem(RAW_KEY, this.checked ? '1' : '0'); } catch (e) {}
  });

  var waveEl = $('#wave'), bars = [];
  for (var i = 0; i < N; i++) { var b = document.createElement('i'); waveEl.appendChild(b); bars.push(b); }
  function paintWave(levels) {
    var off = levels.length - N;
    for (var i = 0; i < N; i++) {
      var v = off + i >= 0 ? levels[off + i] : 0;
      bars[i].style.height = (4 + Math.round(v * 56)) + 'px';
    }
  }
  paintWave([]);

  function status(t, isErr) {
    var el = $('#status');
    el.textContent = t;
    el.classList.toggle('err', !!isErr);
  }

  function openDB() {
    return new Promise(function (res, rej) {
      if (!window.indexedDB) { rej(new Error('no indexedDB')); return; }
      var q = indexedDB.open(DB, 1);
      q.onupgradeneeded = function () {
        var d = q.result;
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('blob')) d.createObjectStore('blob', { keyPath: 'id' });
      };
      q.onsuccess = function () { res(q.result); };
      q.onerror = function () { rej(q.error); };
    });
  }
  function put(meta, blob) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(['meta', 'blob'], 'readwrite');
        tx.objectStore('meta').put(meta);
        tx.objectStore('blob').put({ id: meta.id, blob: blob });
        tx.oncomplete = function () { db.close(); res(); };
        tx.onerror = tx.onabort = function () { db.close(); rej(tx.error || new Error('save failed')); };
      });
    });
  }

  function pickMime() {
    var c = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
    for (var i = 0; i < c.length; i++) {
      try { if (window.MediaRecorder && MediaRecorder.isTypeSupported(c[i])) return c[i]; } catch (e) {}
    }
    return '';
  }
  function extOf(mime) {
    return mime.indexOf('mp4') > -1 ? 'm4a' : mime.indexOf('ogg') > -1 ? 'ogg' : 'webm';
  }
  function downsample(a, n) {
    var out = [], max = 0, i, j;
    if (!a.length) { for (i = 0; i < n; i++) out.push(0.06); return out; }
    for (i = 0; i < n; i++) {
      var s = Math.floor(i * a.length / n), e = Math.max(s + 1, Math.floor((i + 1) * a.length / n)), m = 0;
      for (j = s; j < e && j < a.length; j++) if (a[j] > m) m = a[j];
      out.push(m); if (m > max) max = m;
    }
    var k = max > 0.01 ? 1 / max : 1;
    return out.map(function (v) { return Math.round(Math.max(0.06, Math.min(1, v * k)) * 100) / 100; });
  }
  function defaultName() {
    var d = new Date();
    return 'Voice note ' + d.toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  var st = { rec: null, stream: null, ac: null, an: null, buf: null, chunks: [], t0: 0, levels: [], peaks: [],
             timer: null, sampler: null, discard: false, mime: '', wl: null, busy: false };

  function lock() {
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (l) { st.wl = l; }, function () {}); } catch (e) {}
  }
  function unlock() { try { if (st.wl) { st.wl.release(); st.wl = null; } } catch (e) {} }

  function setRecUI(on) {
    $('#mic').classList.toggle('rec', on);
    $('#mic').setAttribute('aria-label', on ? 'Stop and save recording' : 'Start recording');
    $('#cancel').hidden = !on;
    $('#time').classList.toggle('live', on);
    waveEl.classList.toggle('live', on);
    $('#raw').disabled = on;
  }

  function start() {
    if (st.rec || st.busy) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      status('This browser cannot record audio.', true); return;
    }
    try {
      st.ac = new (window.AudioContext || window.webkitAudioContext)();
      if (st.ac.state === 'suspended') st.ac.resume();
    } catch (e) { st.ac = null; }
    var rawOn = $('#raw').checked;
    status('Asking for the microphone');
    navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: !rawOn, noiseSuppression: !rawOn, autoGainControl: !rawOn }
    }).then(begin, function (err) {
      cleanup();
      status(err && err.name === 'NotAllowedError'
        ? 'Microphone blocked. Allow it in your browser settings, then try again.'
        : 'No microphone found.', true);
    });
  }

  function begin(stream) {
    st.stream = stream; st.chunks = []; st.levels = []; st.peaks = []; st.discard = false;
    var mime = pickMime(), rec;
    try { rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream); }
    catch (e) { rec = new MediaRecorder(stream); }
    st.rec = rec; st.mime = rec.mimeType || mime || 'audio/webm';
    rec.ondataavailable = function (e) { if (e.data && e.data.size) st.chunks.push(e.data); };
    rec.onstop = finish;
    rec.onerror = function () { status('Recording failed.', true); };
    st.an = null;
    try {
      var src = st.ac.createMediaStreamSource(stream);
      st.an = st.ac.createAnalyser(); st.an.fftSize = 1024;
      st.buf = new Uint8Array(st.an.fftSize);
      src.connect(st.an);
    } catch (e) { st.an = null; }
    rec.start(1000);
    st.t0 = performance.now();
    setRecUI(true);
    status('Recording');
    $('#saved').hidden = true;
    lock();
    st.timer = setInterval(function () { $('#time').textContent = fmtLive((performance.now() - st.t0) / 1000); }, 100);
    st.sampler = setInterval(function () {
      var lvl = 0.03;
      if (st.an) {
        st.an.getByteTimeDomainData(st.buf);
        var sum = 0;
        for (var i = 0; i < st.buf.length; i++) { var v = (st.buf[i] - 128) / 128; sum += v * v; }
        var rms = Math.sqrt(sum / st.buf.length);
        st.peaks.push(rms);
        lvl = Math.min(1, rms * 4);
      } else { st.peaks.push(0); }
      st.levels.push(lvl);
      if (st.levels.length > N) st.levels.shift();
      paintWave(st.levels);
    }, 80);
    tell({ type: 'recording', on: true });
  }

  function cleanup() {
    clearInterval(st.timer); clearInterval(st.sampler);
    if (st.stream) st.stream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) {} });
    if (st.ac) { try { st.ac.close(); } catch (e) {} }
    unlock();
    st.stream = null; st.ac = null; st.an = null; st.rec = null;
    setRecUI(false);
    paintWave([]);
    tell({ type: 'recording', on: false });
  }

  function finish() {
    var dur = (performance.now() - st.t0) / 1000;
    var chunks = st.chunks, mime = st.mime, peaks = st.peaks, discard = st.discard;
    cleanup();
    $('#time').textContent = '0:00.0';
    if (discard) { status('Discarded'); return; }
    if (dur < 0.6 || !chunks.length) { status('Too short, so it was not saved.'); return; }
    var blob = new Blob(chunks, { type: mime });
    var meta = {
      id: uid(), name: defaultName(), created: Date.now(), duration: Math.round(dur * 10) / 10,
      mime: blob.type, size: blob.size, peaks: downsample(peaks, N)
    };
    st.busy = true;
    status('Saving');
    put(meta, blob).then(function () {
      st.busy = false;
      status('Saved to history');
      showSaved(meta, null);
      tell({ type: 'saved' });
    }, function () {
      st.busy = false;
      status('Could not save on this browser. Download it instead.', true);
      showSaved(meta, blob);
    });
  }

  var lastBlob = null, lastMeta = null;
  function showSaved(meta, failedBlob) {
    $('#savedName').textContent = meta.name;
    $('#savedSub').textContent = fmt(meta.duration) + ' · ' + Math.max(1, Math.round(meta.size / 1024)) + ' KB';
    $('#openHist').hidden = !inFrame || !!failedBlob;
    $('#dlSaved').hidden = !failedBlob;
    lastBlob = failedBlob; lastMeta = meta;
    $('#saved').hidden = false;
  }

  $('#mic').addEventListener('click', function () {
    if (st.rec) { if (st.rec.state !== 'inactive') st.rec.stop(); }
    else start();
  });
  $('#cancel').addEventListener('click', function () {
    if (st.rec && st.rec.state !== 'inactive') { st.discard = true; st.rec.stop(); }
  });
  $('#openHist').addEventListener('click', function () { tell({ type: 'goto', tab: 'history' }); });
  $('#dlSaved').addEventListener('click', function () {
    if (!lastBlob) return;
    var a = document.createElement('a'), url = URL.createObjectURL(lastBlob);
    a.href = url; a.download = 'voice-note.' + extOf(lastMeta.mime || '');
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  });
})();
</script>
</body>
</html>
